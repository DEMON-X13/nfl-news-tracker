<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 NFL Season Tracker</title>
<meta name="description" content="Week by week breakdown of all 32 NFL teams: last game, positives, negatives, and what is next. Updated every week.">
<meta name="theme-color" content="#F6F5F2">
<meta property="og:type" content="website">
<meta property="og:title" content="2026 NFL Season Tracker">
<meta property="og:description" content="All 32 teams, week by week. Last game, positives, negatives, and what is next.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233D3730'/%3E%3Cpath d='M6 16h20M16 6v20' stroke='%23F4F2EC' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%232F6B4F' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brand"><i></i>2026 NFL Tracker</div>
    <div class="tabswrap" id="tabswrap">
      <button class="tscroll" id="tleft" aria-label="Scroll weeks left">&#8249;</button>
      <div class="tabs" id="weeknav" role="tablist" aria-label="Week"></div>
      <button class="tscroll" id="tright" aria-label="Scroll weeks right">&#8250;</button>
    </div>
    <div class="tools-right">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search team, coach, player" aria-label="Search" autocomplete="off">
        <button id="qx" aria-label="Clear search">&times;</button>
      </div>
      <div class="seg" role="group" aria-label="Conference">
        <button class="chip" data-conf="all" aria-pressed="true">All</button>
        <button class="chip" data-conf="AFC" aria-pressed="false">AFC</button>
        <button class="chip" data-conf="NFC" aria-pressed="false">NFC</button>
      </div>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="results" id="results"></div>
  <div id="view"></div>
</main>
<button class="top" id="top" aria-label="Back to top">&uarr;</button>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovtitle"><div class="ovbox" id="ovbox"></div></div>

<script src="data/teams.js"></script>
<script src="data/week1.js"></script>
<script src="js/app.js"></script>
</body>
</html>
