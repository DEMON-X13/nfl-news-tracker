<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 NFL Season Tracker</title>
<meta name="description" content="Week by week breakdown of all 32 NFL teams: last game, positives, negatives, and what is next. Updated every week.">
<meta name="theme-color" content="#F6F5F2">
<meta property="og:type" content="website">
<meta property="og:title" content="2026 NFL Season Tracker">
<meta property="og:description" content="All 32 teams, week by week. Last game, positives, negatives, and what is next.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233D3730'/%3E%3Cpath d='M6 16h20M16 6v20' stroke='%23F4F2EC' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%232F6B4F' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --sunk:#FAF9F6; --sunk-2:#F1EFEA;
  --ink:#26241F; --ink-2:#6B655C; --ink-3:#A39D93;
  --line:#E9E6E0; --line-2:#DAD5CC;
  --up:#2E7D5B; --down:#C0503A; --info:#3A6390; --warn:#B07D2B;
  --r:14px; --r-s:10px;
  --sh:0 1px 2px rgba(38,36,31,.04);
  --sh-2:0 1px 2px rgba(38,36,31,.05),0 10px 30px -14px rgba(38,36,31,.22);
  --ring:rgba(38,36,31,.09);
  --maxw:1320px;
}
html{box-sizing:border-box;scroll-behavior:smooth;scroll-padding-top:120px}
*,*:before,*:after{box-sizing:inherit}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px}
h1,h2,h3,h4,h5,.num{font-family:"Space Grotesk","Manrope",sans-serif;margin:0;letter-spacing:-.02em}
button{font-family:inherit}
a{color:inherit}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- app bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:rgba(246,245,242,.88);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line)}
.bar-in{max-width:var(--maxw);margin:0 auto;padding:11px 26px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:15.5px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:7px;height:18px;border-radius:2px;background:var(--ink);display:inline-block}
.tabswrap{position:relative;flex:1 1 300px;min-width:0;display:flex;align-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;width:100%;min-width:0;scrollbar-width:none;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.wtab{flex:0 0 auto;border:0;background:transparent;color:var(--ink-3);font-weight:700;font-size:13px;
  padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
.wtab:hover{color:var(--ink);background:var(--sunk-2)}
.wtab[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:var(--sh)}
.wtab[disabled]{color:#C6C1B8;cursor:default;background:none}
.wtab[disabled]:hover{color:#C6C1B8;background:none}
.wtab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tabswrap::before,.tabswrap::after{content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;z-index:2;opacity:0;transition:opacity .15s}
.tabswrap::before{left:0;background:linear-gradient(90deg,#F6F5F2 40%,rgba(246,245,242,0))}
.tabswrap::after{right:0;background:linear-gradient(270deg,#F6F5F2 40%,rgba(246,245,242,0))}
.tabswrap.more-l::before,.tabswrap.more-r::after{opacity:1}
.tscroll{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;display:none;
  align-items:center;justify-content:center;font-size:12px;line-height:1;padding:0}
.tscroll:hover{color:var(--ink)}
#tleft{left:0}#tright{right:0}
.tabswrap.more-l #tleft,.tabswrap.more-r #tright{display:flex}
.tools-right{display:flex;gap:8px;align-items:center;margin-left:auto}
.search{position:relative;flex:1 1 210px;min-width:190px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
#q{width:100%;font:inherit;font-size:13.5px;font-weight:500;padding:8px 32px 8px 33px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);border-radius:9px;transition:box-shadow .15s,border-color .15s}
#q::placeholder{color:var(--ink-3)}
#q:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 3px var(--ring)}
#qx{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;border-radius:6px;
  background:var(--sunk-2);color:var(--ink-2);cursor:pointer;display:none;font-size:13px;line-height:1}
#qx.on{display:block}
#qx:hover{color:var(--ink)}
.seg{display:flex;gap:2px;padding:2px;background:var(--sunk-2);border-radius:9px}
.chip{border:0;background:transparent;color:var(--ink-3);font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.chip:focus-visible,#q:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.count{font-size:12.5px;color:var(--ink-3);white-space:nowrap}

/* ---------- search results ---------- */
.results{display:none;margin:20px 0 -8px;padding:10px 14px;border-radius:var(--r-s);background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.results.on{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.results b{color:var(--ink);font-family:"Space Grotesk",sans-serif}
.results .nav{display:flex;gap:3px;align-items:center;margin-left:auto}
.results .nav button{width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px;
  border:1px solid var(--line-2);background:transparent;border-radius:7px;color:var(--ink-2);cursor:pointer}
.results .nav button:hover{color:var(--ink);border-color:var(--ink-2)}
.results .nav button[disabled]{opacity:.35;cursor:default}
.results .nav .pos{font-size:12.5px;color:var(--ink-3);font-weight:700;min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.results #rclear{width:auto;padding:0 11px;font-size:12.5px;font-weight:700}
body.searching .nosearch{display:none!important}

/* ---------- page head ---------- */
.pagehead{padding:44px 0 6px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--up)}
.eyebrow.sample i{background:var(--down)}
.pagehead h2{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.1;max-width:20ch}
.pagehead p{max-width:70ch;color:var(--ink-2);margin:14px 0 0;font-size:15px}
.sampleflag{margin-top:16px;border-radius:var(--r-s);background:var(--sunk);border:1px solid var(--line-2);border-left:3px solid var(--down);color:var(--ink-2);padding:11px 14px;font-size:13.5px;max-width:70ch}

/* ---------- section heads ---------- */
.sec{padding-top:38px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-head p{margin:0;font-size:13px;color:var(--ink-3)}

/* ---------- slate ---------- */
.slate{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:8px}
.slot{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;transition:border-color .15s,transform .15s,box-shadow .15s}
.slot:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh-2)}
.slot .when{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.slot .vs{font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:700;margin:5px 0 4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.slot .vs em{font-style:normal;font-weight:500;color:var(--ink-3);font-size:12.5px}
.slot .vs i{width:4px;height:15px;border-radius:1px;display:inline-block;flex:0 0 4px}
.slot .score{margin-left:auto;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:16px}
.slot .note{font-size:12px;color:var(--ink-3);line-height:1.45}

/* ---------- game block ---------- */
.game{margin-top:44px;scroll-margin-top:104px}
.game-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:7px}
.game-head h3{font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.game-head h3 i{width:4px;height:17px;border-radius:1px;display:inline-block}
.game-head h3 em{font-style:normal;font-weight:500;color:var(--ink-3);font-size:14px}
.game-head .meta{font-size:12.5px;color:var(--ink-3);margin-left:auto;font-weight:600}
.game-note{font-size:14px;color:var(--ink-2);margin:0 0 11px;max-width:82ch}
.fsbtn{display:inline-flex;align-items:center;gap:7px;margin:0 0 14px;padding:6px 12px;
  background:transparent;border:1px solid var(--line-2);border-radius:8px;cursor:pointer;
  font-family:"Space Grotesk",sans-serif;font-size:12px;font-weight:700;color:var(--ink-2);
  transition:border-color .15s,color .15s,background .15s}
.fsbtn svg{width:13px;height:13px}
.fsbtn:hover{color:var(--ink);border-color:var(--ink-2);background:var(--surface)}
.fsbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pair{display:grid;gap:14px;align-items:stretch}
@media(min-width:1060px){.pair{grid-template-columns:1fr 1fr}}

/* ---------- team card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;scroll-margin-top:104px;display:flex;flex-direction:column;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:var(--sh-2)}
.card.hide{display:none}
.card-top{padding:16px 18px 13px;border-bottom:1px solid var(--line);position:relative}
.card-top::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc)}
.card-top .row{display:flex;align-items:center;gap:11px}
.badge{width:36px;height:36px;border-radius:9px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;
  font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:11.5px;color:#fff;background:var(--tc)}
.card-top h4{font-size:18px;font-weight:700;line-height:1.2}
.card-top .sub{font-size:13.5px;color:var(--ink-2);margin-top:9px;line-height:1.5;min-height:3em}
.mini{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.pill{display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:7px;background:var(--sunk-2);font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.02em}
.pill b{font-family:"Space Grotesk",sans-serif;font-size:12.5px;color:var(--ink);font-weight:700}
.pill.win b{color:var(--up)}.pill.loss b{color:var(--down)}

/* ---------- panels: no fills, hairlines only ---------- */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;align-items:stretch}
.panel{padding:15px 18px 16px;border-top:1px solid var(--line);min-width:0}
.panel:nth-child(odd){border-right:1px solid var(--line)}
.panel.span{grid-column:1 / -1;border-right:0}
.panel h5{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 10px;display:flex;align-items:center;gap:7px}
.panel h5::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:0 0 6px}
.panel.up h5::before{background:var(--up)}
.panel.down h5::before{background:var(--down)}
.panel.rank h5::before{background:var(--info)}
.panel.nx h5::before{background:var(--warn)}
.panel h5 svg{display:none}
.panel ul{margin:0;padding:0;list-style:none}
.panel li{position:relative;padding-left:13px;margin-bottom:9px;font-size:13.8px;line-height:1.55;color:var(--ink)}
.panel li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--line-2)}
.panel li:last-child{margin-bottom:0}
.panel li strong{font-weight:700}
.pending{font-size:12.5px;color:var(--ink-3)}
@media(max-width:700px){.panels{grid-template-columns:1fr}.panel:nth-child(odd){border-right:0}}

/* ---------- rankings + next game ---------- */
.stack{display:flex;flex-direction:column;min-width:0;border-top:1px solid var(--line)}
.stack .panel{border-top:0}
.stack .panel.rank{flex:1 1 auto;border-right:0}
.stack .panel.nx{flex:0 0 auto;border-top:1px solid var(--line);border-right:0;padding-top:13px;padding-bottom:14px}
.rk{display:grid;grid-template-columns:1fr auto auto;gap:7px 10px;align-items:center}
.rk .hd{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-align:right}
.rk .hd.l{text-align:left}
.rk .nm{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.rk .rvcell{text-align:right}
.rk .rv{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rk .v{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;min-width:38px;text-align:center;
  padding:3px 7px;border-radius:7px;background:var(--sunk-2);color:var(--ink);font-variant-numeric:tabular-nums}
.rk .v sup{font-size:8px;font-weight:600;color:var(--ink-3);top:-.6em}
.rk .v.better{background:#E4F1EA;color:var(--up)}
.rk .v.worse{background:#FAE9E5;color:var(--down)}
.nxrow{display:flex;align-items:center;gap:10px}
.nxrow .badge{width:30px;height:30px;flex:0 0 30px;border-radius:8px;font-size:10.5px}
.nxrow .who{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:13.5px;line-height:1.2}
.nxrow .whn{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px}
.nxrow .ha{margin-left:auto;flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;background:var(--sunk-2);color:var(--ink-3);align-self:flex-start}
.nxvenue{font-size:11px;color:var(--ink-3);margin-top:7px}

/* ---------- guide ---------- */
.div-block{margin-top:42px}
.div-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.div-head h3{font-size:17px;font-weight:700}
.div-head span{font-size:12.5px;color:var(--ink-3)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:740px;font-size:13.5px}
th{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-align:right;
  padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;background:var(--surface);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
th:hover,th[aria-sort]{color:var(--ink)}
th[aria-sort="ascending"]::after{content:"\2191";margin-left:4px}
th[aria-sort="descending"]::after{content:"\2193";margin-left:4px}
td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);color:var(--ink-2);white-space:nowrap;
  font-family:"Space Grotesk",sans-serif;font-weight:500;font-variant-numeric:tabular-nums}
td:first-child{font-family:"Manrope",sans-serif}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
td a{color:var(--ink);text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:9px}
td a:hover{text-decoration:underline}
.dot{width:4px;height:15px;border-radius:1px;flex:0 0 4px}
.pos{color:var(--up)}.neg{color:var(--down)}

/* ---------- data tools ---------- */
.tools{margin-top:52px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh)}
.tools>summary{cursor:pointer;padding:15px 20px;font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
.tools>summary::-webkit-details-marker{display:none}
.tools>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-left:auto;transition:transform .15s}
.tools[open]>summary::after{transform:rotate(-135deg)}
.tools-body{padding:0 20px 20px;border-top:1px solid var(--line)}
.tools-body p{font-size:13.5px;color:var(--ink-2);max-width:80ch;margin:14px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.btn{font-size:12.5px;font-weight:700;font-family:"Space Grotesk",sans-serif;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:8px 15px;border-radius:8px;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink-2);opacity:1}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
textarea{width:100%;min-height:140px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;
  padding:12px;border:1px solid var(--line-2);background:var(--sunk);color:var(--ink);border-radius:10px;resize:vertical}
textarea:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 3px var(--ring)}
.status{font-size:13px;color:var(--up);min-height:19px;margin-top:8px;font-weight:700}
.status.err{color:var(--down)}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* ---------- overlay ---------- */
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;background:rgba(26,24,20,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.on{display:flex}
.ovbox{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);max-width:720px;width:100%;
  box-shadow:0 32px 70px -12px rgba(26,24,20,.4);overflow:hidden}
.ovhd{padding:18px 22px 15px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:flex-start;gap:14px;position:sticky;top:0;z-index:2}
.ovhd h3{font-size:19px;font-weight:700;line-height:1.25}
.ovhd .sub{font-size:12.5px;color:var(--ink-3);margin-top:5px;font-weight:600}
.ovhd .x{margin-left:auto;flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:16px;cursor:pointer;line-height:1}
.ovhd .x:hover{color:var(--ink);border-color:var(--ink-2)}
.ovbody{padding:8px 22px 24px}
.ovsec{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sbar{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;margin-bottom:12px}
.sbar .sv{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;text-align:center;padding:4px;border-radius:7px;background:var(--sunk-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.sbar .sv.win{background:#E4F1EA;color:var(--up)}
.sbar .mid{text-align:center}
.sbar .mid .lb{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.02em;display:block;margin-bottom:5px}

  "NFC West":"The champion, the favorite, and a 12-win team."
};
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const sign = n => (n>0?"+":"") + n;
const esc  = s => String(s).replace(/<[^>]+>/g,"").replace(/"/g,"");
const li   = a => a.map(x=>`<li>${x}</li>`).join("");
const txt  = c => { const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16); return (r*299+g*587+b*114)/1000 > 140 ? "#332E29" : "#fff"; };
const ICON = {
  n:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h16M4 6h16M4 18h10"/></svg>`,
  up:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>`,
  rank:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>`,
  next:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  down:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><path d="M10.3 3.9L2.6 17.3A2 2 0 004.3 20h15.4a2 2 0 001.7-2.7L13.7 3.9a2 2 0 00-3.4 0z"/></svg>`
};

/* ============================ state ============================ */
let ACTIVE = "guide";
let conf = "all";

/* ============================ tabs ============================ */
function buildNav(){
  const upcoming = [];
  for (let w = 2; w <= 18; w++) if (!WEEKS.some(x=>x.id==="wk"+w)) upcoming.push(w);
  document.getElementById("weeknav").innerHTML =
    `<button class="wtab" role="tab" data-id="guide">Season guide</button>` +
    WEEKS.map(w=>`<button class="wtab ${w.status==="sample"?"sample":""}" role="tab" data-id="${w.id}">${w.label}</button>`).join("") +
    upcoming.map(w=>`<button class="wtab" role="tab" disabled title="Not published yet">Wk ${w}</button>`).join("");
  document.querySelectorAll(".wtab[data-id]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));
  tabEdges();
}
function tabEdges(){
  const s = document.getElementById("weeknav"), wrap = document.getElementById("tabswrap");
  if (!s || !wrap) return;
  const max = s.scrollWidth - s.clientWidth;
  wrap.classList.toggle("more-l", s.scrollLeft > 4);
  wrap.classList.toggle("more-r", s.scrollLeft < max - 4);
}
function revealTab(id){
  const b = document.querySelector('.wtab[data-id="' + id + '"]');
  if (b && b.scrollIntoView) b.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
  setTimeout(tabEdges, 350);
}
function show(id){
  ACTIVE = id;
  document.querySelectorAll(".wtab[data-id]").forEach(b=>b.setAttribute("aria-selected", b.dataset.id===id));
  revealTab(id);
  document.getElementById("view").innerHTML = (id==="guide") ? renderGuide() : renderWeek(WEEKS.find(w=>w.id===id));
  if (id==="guide") wireBoard();
  wireTools();
  apply();
  window.scrollTo({top:0,behavior:"auto"});
}

/* ============================ week tab ============================ */

  <p class="empty" id="empty">No team matches that search.</p>

function weekMini(t,w,ab){
  const g = w.games.find(x=>x.away===ab||x.home===ab);
  const out = [["2025", t.rec], ["win total", t.wt], ["rank", t.rank]];
  if (g){
    const home = g.home===ab;
    out.push([home?"home game":"away game", home?g.away:g.home]);
    if (g.awayScore!=null){
      const mine = home?g.homeScore:g.awayScore, theirs = home?g.awayScore:g.homeScore;
      const res = mine>theirs?"W":mine<theirs?"L":"T";
      out.push(["result", res+" "+mine+"-"+theirs, res==="W"?"win":res==="L"?"loss":""]);
    } else out.push(["kickoff", kickOf(g).time]);
  }
  return out;
}

/* ============================ ranks ============================ */
const BASE = (()=>{
  const rankBy = (arr, key, desc) => {
    const s = [...arr].sort((a,b)=> desc ? b[key]-a[key] : a[key]-b[key]);
    const m = {}; s.forEach((t,i)=> m[t.ab] = i+1); return m;
  };
  const off = rankBy(TEAMS,"pf",true);      // most points scored in 2025
  const def = rankBy(TEAMS,"pa",false);     // fewest points allowed in 2025
  const srs = rankBy(TEAMS,"srs",true);     // 2025 overall finish
  const ppg = rankBy(TEAMS,"pf",true);      // points per game, 2025
  const tom = rankBy(TEAMS,"to",true);      // turnover differential, 2025
  const m = {}; TEAMS.forEach(t => m[t.ab] = {off:off[t.ab], def:def[t.ab], srs:srs[t.ab], ppg:ppg[t.ab], tom:tom[t.ab],
    ppgv:Math.round(t.pf/17*10)/10, tov:t.to});
  return m;
})();
function defaultGrades(ab){
  const b = BASE[ab], t = T[ab];
  return { overall:{rank:t.rank, prev:b.srs}, offense:{rank:b.off}, defense:{rank:b.def} };
}
const TZFMT = (()=>{ try { return new Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e){ return ""; } })();
function kickOf(g){
  const done = g.awayScore != null && g.homeScore != null;
  if (done) return { day: g.day, time: "Final" };
  if (!g.kick) return { day: g.day, time: g.time };
  const dt = new Date(g.kick);
  if (isNaN(dt.getTime())) return { day: g.day, time: g.time };
  try {
    return {
      day: new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric"}).format(dt),
      time: new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit",timeZoneName:"short"}).format(dt)
    };
  } catch(e){ return { day: g.day, time: g.time }; }
}
const ORD = n => { const s=["th","st","nd","rd"], v=n%100; return n + "<sup>" + (s[(v-20)%10]||s[v]||s[0]) + "</sup>"; };
function deltaChip(g){
  if (!g || g.rank==null || g.prev==null) return '<span class="delta none">0</span>';
  const d = g.prev - g.rank;
  if (d === 0) return '<span class="delta flat">even</span>';
  return '<span class="delta ' + (d>0?"up":"down") + '">' + (d>0?"\u25B2":"\u25BC") + " " + Math.abs(d) + '</span>';
}
function gradeBlock(w, ab, grades){
  const g = grades || defaultGrades(ab);
  const cap = w.type === "outlook"
    ? "Preseason rank, change since 2025 finish"
    : "Rank after " + w.label + ", change from last week";
  const cell = (lab, o) => `<div class="grade"><span class="lab">${lab}</span>
    <span class="val">${o && o.rank!=null ? ORD(o.rank) : "&ndash;"}</span>${deltaChip(o)}</div>`;
  return `<div class="gradecap">${cap}</div><div class="grades">
    ${cell("Overall", g.overall)}${cell("Offense", g.offense)}${cell("Defense", g.defense)}
  </div>`;
}

/* ============================ matchup block ============================ */
function rk(ab, w){
  const t = T[ab], b = BASE[ab];
  const entry = (w.teams||{})[ab] || {};
  const g = entry.ranks || {};
  return {
    overall: g.overall || {rank:t.rank},
    offense: g.offense || {rank:b.off},
    defense: g.defense || {rank:b.def},
    ppg:     g.ppg     || {rank:b.ppg, val:b.ppgv},
    turnover:g.turnover|| {rank:b.tom, val:(b.tov>0?"+":"")+b.tov}
  };
}
function vsBlock(g, w){
  const a = T[g.away], hm = T[g.home];
  const ra = rk(g.away, w), rh = rk(g.home, w);
  const row = (lab, x, y) => {
    const bx = x.rank < y.rank, by = y.rank < x.rank;
    return `<div class="vrow">
      <div class="vnum ${bx?"better":""}">${ORD(x.rank)}</div>
      <div class="vlab">${lab}</div>
      <div class="vnum ${by?"better":""}">${ORD(y.rank)}</div>
    </div>`;
  };
  return `<div class="vsgrid">
    <div class="vteam"><i style="background:${a.color}"></i>${a.ab}</div>
    <div class="vh">rank of 32</div>
    <div class="vteam r">${hm.ab}<i style="background:${hm.color}"></i></div>
    ${row("Overall", ra.overall, rh.overall)}
    ${row("Offense", ra.offense, rh.offense)}
    ${row("Defense", ra.defense, rh.defense)}
  </div>`;
}
function cmpTable(g, w){
  const a = T[g.away], hm = T[g.home];
  const num = v => Math.round(v*10)/10;
  const base = [
    {label:"Points per game", a:num(a.pf/17), h:num(hm.pf/17), hi:"a", note:"2025"},
    {label:"Points allowed", a:num(a.pa/17), h:num(hm.pa/17), hi:"lo", note:"2025"},
    {label:"Point differential", a:a.pd, h:hm.pd, hi:"sign", note:"2025"},
    {label:"SRS", a:num(a.srs), h:num(hm.srs), hi:"sign", note:"2025"},
    {label:"Posted win total", a:a.wt, h:hm.wt, hi:"a", note:"2026"},
    {label:"Analyst rank", a:a.rank, h:hm.rank, hi:"lo", note:"of 32"}
  ];
  const rows = base.concat(g.rows||[]);
  const fmtv = (v, hi) => (hi==="sign" && typeof v==="number" && v>0) ? "+"+v : v;
  const cell = (v, other, hi) => {
    const n = parseFloat(v), o = parseFloat(other);
    const better = isNaN(n)||isNaN(o)||n===o ? false : (hi==="lo" ? n<o : n>o);
    return `<td class="${better?"win":""}">${fmtv(v, hi)}</td>`;
  };
  return `<table class="cmp"><thead><tr>
      <th>${a.ab}</th><th></th><th>${hm.ab}</th>
    </tr></thead><tbody>
    ${rows.map(r=>`<tr>
      ${cell(r.a, r.h, r.hi)}
      <td class="mid">${r.label}${r.note?`<small>${r.note}</small>`:""}</td>
      ${cell(r.h, r.a, r.hi)}
    </tr>`).join("")}
  </tbody></table>`;
}
/* ============================ momentum ============================ */
function streakOf(ab){
  const res = [];
  WEEKS.forEach(wk=>(wk.games||[]).forEach(g=>{
    if (g.awayScore==null || g.homeScore==null) return;
    if (g.away!==ab && g.home!==ab) return;
    const home = g.home===ab, mine = home?g.homeScore:g.awayScore, th = home?g.awayScore:g.homeScore;
    res.push(mine>th?"W":mine<th?"L":"T");
  }));
  if (!res.length) return {label:"Season opener", cls:"", note:"no games played"};
  let n = 1;
  for (let i=res.length-1; i>0 && res[i]===res[i-1]; i--) n++;
  const k = res[res.length-1];
  const w = res.filter(x=>x==="W").length, l = res.filter(x=>x==="L").length, t = res.filter(x=>x==="T").length;
  const rec = w+"-"+l+(t?"-"+t:"");
  if (k==="T") return {label:"Tied last out", cls:"", note:rec};
  if (k==="W") return n>=3 ? {label:"Hot Streak! W"+n, cls:"hot", note:rec}
              : n===2 ? {label:"Rolling, W2", cls:"warm", note:rec}
              : {label:"Won last out", cls:"warm", note:rec};
  return n>=3 ? {label:"Skid, L"+n, cls:"cool", note:rec}
       : n===2 ? {label:"Cooling off, L2", cls:"cool", note:rec}
       : {label:"Lost last out", cls:"cool", note:rec};
}

/* ============================ rankings panel ============================ */
function rankPanel(g, ab, w){
  const opp = T[g.home===ab ? g.away : g.home];
  const me = rk(ab, w), them = rk(opp.ab, w);
  const row = (lab, a, b) => {
    const cls = a.rank < b.rank ? "better" : a.rank > b.rank ? "worse" : "";
    const val = a.val != null ? `<span class="rv">${a.val}</span>` : "";
    return `<div class="nm">${lab}</div><div class="rvcell">${val}</div>
      <div class="v ${cls}">${ORD(a.rank)}</div>`;
  };
  return `<div class="stack"><div class="panel rank">
    <h5>${ICON.rank}Team rankings</h5>
    <div class="rk">
      <div class="hd l"></div><div class="hd"></div><div class="hd">rank of 32</div>
      ${row("Overall", me.overall, them.overall)}
      ${row("Offense", me.offense, them.offense)}
      ${row("Defense", me.defense, them.defense)}
      ${row("Points per game", me.ppg, them.ppg)}
      ${row("Turnover margin", me.turnover, them.turnover)}
    </div>
  </div>
  ${nextPanel(ab, w)}</div>`;
}
function nextPanel(ab, w){
  const nx = w.next;
  if (!nx || !nx.games) return "";
  const g = nx.games.find(x=>x.away===ab||x.home===ab);
  const head = `<h5>${ICON.next}Next game<span style="margin-left:auto;font-weight:600;color:var(--ink-3);letter-spacing:.06em">${nx.label||""}</span></h5>`;
  if (!g) return `<div class="panel nx">${head}<div class="pending">Bye week.</div></div>`;
  const home = g.home===ab, opp = T[home?g.away:g.home], k = kickOf(g);
  return `<div class="panel nx">${head}
    <div class="nxrow">
      <div class="badge" style="background:${opp.color};color:${txt(opp.color)}">${opp.ab}</div>
      <div><div class="who">${opp.name}</div><div class="whn">${k.day} &middot; ${k.time} &middot; ${g.tv}</div></div>
      <span class="ha ${home?"h":"a"}">${home?"Home":"Away"}</span>
    </div>
    <div class="nxvenue">${g.venue}</div>
  </div>`;
}

/* ============================ shared card ============================ */
function teamCard(t, sub, sections, mini, extra){
  const search = esc([t.name,t.ab,t.div,sub,sections.map(s=>s.t+" "+s.items.join(" ")).join(" "), extra||""].join(" "));
  return `<article class="card" id="${slug(t.name)}-${ACTIVE}" style="--tc:${t.color}" data-conf="${t.conf}" data-search="${search}">
    <div class="card-top">
      <div class="row">
        <div class="badge" style="color:${txt(t.color)}">${t.ab}</div>
        <div><h4>${t.name}</h4><div class="sub">${sub}</div></div>
      </div>
      <div class="mini">${mini.map(m=>`<span class="pill ${m[2]||""}"><b>${m[1]}</b>${m[0]}</span>`).join("")}</div>
    </div>
    <div class="panels">${sections.map(s=>`
      <div class="panel ${s.tone==="up"?"up":s.tone==="down"?"down":""} ${s.span?"span":""}">
        <h5>${ICON[s.tone==="up"?"up":s.tone==="down"?"down":"n"]}${s.t}</h5>
        ${s.items.length ? `<ul>${li(s.items)}</ul>` : `<div class="pending">Nothing loaded for this section yet.</div>`}
      </div>`).join("")}${extra||""}</div>
  </article>`;
}

/* ============================ board sorting ============================ */
let boardRows=[], sortKey="rank", sortDir=1;
function paintBoard(rows){
  const tb = document.querySelector("#board tbody"); if(!tb) return;
  tb.innerHTML = rows.map(t=>`<tr><td><a href="#${slug(t.name)}-guide"><i class="dot" style="background:${t.color}"></i>${t.name}</a></td>
    <td>${t.rec}</td><td>${t.pf}</td><td>${t.pa}</td>
    <td class="${t.pd>0?'pos':'neg'}">${sign(t.pd)}</td>
    <td class="${t.srs>0?'pos':'neg'}">${sign(t.srs.toFixed(1))}</td>
    <td>${t.wt}</td><td>${t.rank}</td></tr>`).join("");
}
function wireBoard(){
  boardRows = [...TEAMS].sort((a,b)=>a.rank-b.rank); sortKey="rank"; sortDir=1;
  paintBoard(boardRows);
  document.querySelectorAll("#board th").forEach(th=>{
    th.addEventListener("click",()=>{
      const k=th.dataset.k, num=th.dataset.t==="n";
      sortDir = (k===sortKey) ? -sortDir : (num?-1:1); sortKey=k;
      boardRows.sort((a,b)=> num ? (a[k]-b[k])*sortDir : String(a[k]).localeCompare(String(b[k]))*sortDir);
      document.querySelectorAll("#board th").forEach(x=>x.removeAttribute("aria-sort"));
      th.setAttribute("aria-sort", sortDir===1?"ascending":"descending");
      paintBoard(boardRows);
    });
  });
  const rt = document.querySelector('#board th[data-k="rank"]'); if(rt) rt.setAttribute("aria-sort","ascending");
}

/* ============================ filtering ============================ */
function apply(){
  clearMarks();
  const q = document.getElementById("q");
  const term = (q.value||"").trim().toLowerCase();
  document.body.classList.toggle("searching", !!term);
  document.getElementById("qx").classList.toggle("on", !!term);
  let shown = 0;
  document.querySelectorAll(".card").forEach(c=>{
    const on = (conf==="all"||c.dataset.conf===conf) && (!term || c.dataset.search.toLowerCase().includes(term));
    c.classList.toggle("hide", !on); if(on) shown++;
  });
  document.querySelectorAll(".div-block, .game").forEach(s=>{
    s.style.display = s.querySelectorAll(".card:not(.hide)").length ? "" : "none";
  });
  const r = document.getElementById("results");
  if (term){
    const label = ACTIVE==="guide" ? "the season guide" : (WEEKS.find(w=>w.id===ACTIVE)||{}).label;
    r.innerHTML = `<span><b>${shown}</b> ${shown===1?"team":"teams"} in ${label}${conf!=="all"?" ("+conf+" only)":""}</span>
      <span class="nav">
        <span class="pos" id="rpos"></span>
        <button type="button" id="rprev" title="Previous match (Shift+Enter)">&uarr;</button>
        <button type="button" id="rnext" title="Next match (Enter)">&darr;</button>
        <button type="button" id="rclear">Clear</button>
      </span>`;
    r.classList.add("on");
    document.getElementById("rclear").addEventListener("click", clearSearch);
    document.getElementById("rprev").addEventListener("click", ()=>step(-1));
    document.getElementById("rnext").addEventListener("click", ()=>step(1));
    HITS = term.length >= 2 ? markAll(term) : [];
    CUR = -1;
    if (HITS.length) step(1, true);
    paintPos();
  } else { r.classList.remove("on"); r.innerHTML=""; }
  const eEl=document.getElementById("empty"); if(eEl) eEl.classList.toggle("on", shown===0);
}
let HITS = [], CUR = -1;
function clearMarks(){
  const root = document.getElementById("view"); if(!root) return;
  root.querySelectorAll("mark.hit").forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  root.querySelectorAll(".panel, .card-top, .nextrow, .nextvenue").forEach(n => n.normalize());
  root.querySelectorAll(".card.hasCur").forEach(c => c.classList.remove("hasCur"));
  HITS = []; CUR = -1;
}
function markAll(term){
  const out = [];
  document.querySelectorAll(".card:not(.hide)").forEach(card=>{
    const walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        if (n.parentElement && n.parentElement.closest("mark")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = []; let n;
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(node=>{
      const txt = node.nodeValue, low = txt.toLowerCase();
      let i = low.indexOf(term);
      if (i < 0) return;
      const frag = document.createDocumentFragment();
      let last = 0;
      while (i >= 0){
        if (i > last) frag.appendChild(document.createTextNode(txt.slice(last, i)));
        const m = document.createElement("mark");
        m.className = "hit";
        m.textContent = txt.slice(i, i + term.length);
        frag.appendChild(m); out.push(m);
        last = i + term.length;
        i = low.indexOf(term, last);
      }
      if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  });
  return out;
}
function paintPos(){
  const el = document.getElementById("rpos"); if(!el) return;
  el.textContent = HITS.length ? (CUR+1) + " of " + HITS.length : "no matches";
  const p = document.getElementById("rprev"), nx = document.getElementById("rnext");
  if (p) p.disabled = HITS.length < 2;
  if (nx) nx.disabled = HITS.length < 2;
}
function step(dir, first){
  if (!HITS.length) return;
  if (HITS[CUR]){
    HITS[CUR].classList.remove("cur");
    const c = HITS[CUR].closest(".card"); if (c) c.classList.remove("hasCur");
  }
  CUR = first ? 0 : (CUR + dir + HITS.length) % HITS.length;
  const m = HITS[CUR];
  m.classList.add("cur");
  const card = m.closest(".card"); if (card) card.classList.add("hasCur");
  m.scrollIntoView({block:"center", behavior: first ? "auto" : "smooth"});
  paintPos();
}
function clearSearch(){
  const q=document.getElementById("q"); q.value=""; apply(); q.focus();
}

function nextWeekNum(){
  return Math.max(0, ...WEEKS.filter(w=>w.status!=="sample").map(w=>parseInt((w.id.match(/\d+/)||[0])[0],10)||0)) + 1;
}
function statRequest(w){
  const nextNum = nextWeekNum();
  return `Build the Week ${nextNum} recap for my 2026 NFL tracker.

Pull from reputable sources (Pro Football Reference box scores, ESPN, NFL.com, team sites, Sharp Football, PFF where public) and give me back ONE JSON object matching the schema below. No prose outside the JSON.

Structure. Each GAME gets a shared matchup block that applies to both teams. Each TEAM gets its own panels.

For every GAME:
  line      - the closing spread and total, e.g. "KC -2.5, O/U 43.5"
  note      - one line on what the game is
  preview   - 3 or 4 bullets. This is the centerpiece, so make it about THIS matchup, not team history:
                the key individual or unit matchups, which way momentum is running, and the winning factor.
                Lead with where the beat writers and analysts agree. If they split, say so in one bullet.
  keys      - 3 to 5 deeper bullets shown when the reader expands the breakdown. Injuries that swing the
                game, scheme wrinkles, head to head history with the numbers, situational splits.
  rows      - optional extra stat comparison rows, each {label, a, h, hi, note} where "a" is the away value,
                "h" is the home value, hi is "a" when higher is better or "lo" when lower is better, and note
                is a short qualifier like "2026" or "per game". Use these for turnover differential, third
                down rate, red zone TD rate, yards per play, sacks, and key player numbers. Six team rows
                (points for and against, differential, SRS, win total, analyst rank) are added automatically,
                so do not repeat those.

For every one of the 32 TEAMS:
  last        - 2 or 3 bullets on their most recent game: score, record, how it flowed, hard numbers.
                Empty array if they have not played yet.
  strengths   - 3 bullets on what this team does well as a unit, and name who has to step up inside it.
  weaknesses  - 3 bullets on where it breaks down, including injuries and what sources flag as a concern.
  ranks       - five ranks, each {rank, prev}, out of 32 with no ties. 1 is always best.
                  overall  - your read of the team right now, blending record, point differential, and how
                             they have actually played.
                  offense  - season to date scoring and efficiency.
                  defense  - same on the other side of the ball.
                  ppg      - points per game, season to date. Include "val" with the number itself.
                  turnover - turnover margin, season to date. Include "val" as a signed string like "+4".
                "prev" is that team's rank in the previous week's file.

Rules I want followed:
  - No em dashes and no double dashes anywhere in the text.
  - Bullets, not paragraphs. Every claim that is a number should carry the number.
  - Bold key names with <strong> tags.
  - Every game needs a "kick" field: the kickoff as a UTC ISO timestamp, so the page can show it in each
    reader's own time zone. Eastern is UTC-4 through early November, UTC-5 after. A 1:00 PM ET Sunday
    kickoff on Sep 20 is "2026-09-20T17:00:00Z". Keep "day" and "time" too as an Eastern fallback.
  - If something is genuinely unknown, use an empty array rather than guessing.

Schema:
{
  "id": "wk${nextNum}",
  "label": "Week ${nextNum}",
  "type": "recap",
  "status": "live",
  "dates": "Month D to Month D, 2026",
  "headline": "one short line",
  "intro": "two or three sentences on the week as a whole",
  "games": [
    { "away":"NE", "home":"SEA", "day":"Sun Sep 20", "time":"1:00 PM ET",
      "kick":"2026-09-20T17:00:00Z", "tv":"CBS", "venue":"Stadium, City",
      "line":"SEA -3.5, O/U 44.5", "note":"one line on the game",
      "awayScore":17, "homeScore":24,
      "preview":["key matchup","momentum","winning factor"],
      "keys":["deeper point","deeper point"],
      "rows":[ {"label":"Turnover differential","a":"+2","h":"-1","hi":"a","note":"2026"} ]
    }
  ],
  "teams": {
    "SEA": {
      "headline": "one short line for the card header",
      "last": ["what happened, with numbers"],
      "strengths": ["what they do well and who steps up"],
      "weaknesses": ["where it breaks down, injuries included"],
      "ranks": {
        "overall": { "rank": 3, "prev": 3 },
        "offense": { "rank": 6, "prev": 2 },
        "defense": { "rank": 1, "prev": 1 },
        "ppg":      { "rank": 4, "prev": 5, "val": 27.5 },
        "turnover": { "rank": 3, "prev": 3, "val": "+4" }
      }
    }
  }
}

Team keys, all 32: ${TEAMS.map(t=>t.ab).join(", ")}`;
}

function blankTemplate(){
  const nextNum = nextWeekNum();
  return {
    id:"wk"+nextNum, label:"Week "+nextNum, type:"recap", status:"live",
    dates:"", headline:"", intro:"", games:[],
    teams: Object.fromEntries(TEAMS.map(t=>[t.ab,{
      headline:"", last:[], strengths:[], weaknesses:[],
      ranks:{overall:{rank:null,prev:null}, offense:{rank:null,prev:null}, defense:{rank:null,prev:null}, ppg:{rank:null,prev:null,val:null}, turnover:{rank:null,prev:null,val:null}}
    }]))
  };
}

function download(name, text){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"application/json"}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 400);
}
function say(msg, bad){
  const s = document.getElementById("status"); if(!s) return;
  s.textContent = msg; s.classList.toggle("err", !!bad);
}
function toClipboard(text){
  const box = document.getElementById("io");
  box.value = text; box.focus(); box.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){}
  const done = () => say("Copied. Paste it into Claude.");
  const fail = () => say(ok ? "Copied. Paste it into Claude." : "Could not reach the clipboard. The text is selected in the box, copy it manually.", !ok);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fail);
  else fail();
}
function wireTools(){
  const t = document.getElementById("tools"); if(!t) return;
  const w = WEEKS.find(x=>x.id===ACTIVE);
  document.getElementById("btn-req").addEventListener("click", ()=>toClipboard(statRequest(w)));
  document.getElementById("btn-tmpl").addEventListener("click", ()=>{
    download("nfl-2026-week-template.json", JSON.stringify(blankTemplate(), null, 2)); say("Template downloaded.");
  });
  document.getElementById("btn-exp").addEventListener("click", ()=>{
    download("weeks.json", JSON.stringify(WEEKS.filter(x=>x.id!=="wk1"), null, 2));
    say("weeks.json downloaded. Upload it next to index.html to publish these weeks.");
  });
  document.getElementById("btn-clear").addEventListener("click", ()=>{ document.getElementById("io").value=""; say(""); });
  document.getElementById("btn-load").addEventListener("click", ()=>{
    const raw = document.getElementById("io").value.trim();
    if (!raw) return say("Nothing in the box.", true);
    let data;
    try { data = JSON.parse(raw); } catch(e){ return say("That is not valid JSON. " + e.message, true); }
    const list = Array.isArray(data) ? data : [data];
    const bad = list.find(d => !d || !d.id || !d.label || !d.teams);
    if (bad) return say("A week is missing id, label, or teams.", true);
    let added = 0;
    list.forEach(d=>{
      d.games = d.games || []; d.status = d.status || "live"; d.type = d.type || "recap";
      d.dates = d.dates || ""; d.headline = d.headline || ""; d.intro = d.intro || "";
      const i = WEEKS.findIndex(x=>x.id===d.id);
      if (i >= 0) WEEKS[i] = d; else { WEEKS.push(d); added++; }
    });
    WEEKS.sort((a,b)=>{
      const n = x => x.status==="sample" ? 999 : (parseInt((x.id.match(/\d+/)||[0])[0],10)||0);
      return n(a)-n(b);
    });
    buildNav();
    show(list[0].id);
    say((added?added+" week added. ":"Week replaced. ") + "Now showing it.");
    document.getElementById("tools").open = true;
  });
}

/* full stats overlay */
function openStats(key){
  const w = WEEKS.find(x=>x.id===ACTIVE); if(!w) return;
  const g = (w.games||[]).find(x=>x.away+"-"+x.home===key); if(!g) return;
  const a = T[g.away], hm = T[g.home], k = kickOf(g);
  const num = v => Math.round(v*10)/10;
  const rows = [
    {label:"Points per game", a:num(a.pf/17), h:num(hm.pf/17), hi:"a", note:"2025"},
    {label:"Points allowed", a:num(a.pa/17), h:num(hm.pa/17), hi:"lo", note:"2025"},
    {label:"Point differential", a:a.pd, h:hm.pd, hi:"sign", note:"2025"},
    {label:"SRS", a:num(a.srs), h:num(hm.srs), hi:"sign", note:"2025"},
    {label:"Posted win total", a:a.wt, h:hm.wt, hi:"a", note:"2026"},
    {label:"Analyst rank", a:a.rank, h:hm.rank, hi:"lo", note:"of 32"},
    {label:"Turnover margin", a:a.to, h:hm.to, hi:"sign", note:"2025"}
  ].concat(g.rows||[]);
  const ra = rk(g.away, w), rh = rk(g.home, w);
  const rankRows = [
    {label:"Overall rank", a:ra.overall.rank, h:rh.overall.rank, hi:"lo", note:"of 32"},
    {label:"Offense rank", a:ra.offense.rank, h:rh.offense.rank, hi:"lo", note:"of 32"},
    {label:"Defense rank", a:ra.defense.rank, h:rh.defense.rank, hi:"lo", note:"of 32"},
    {label:"Points per game rank", a:ra.ppg.rank, h:rh.ppg.rank, hi:"lo", note:"of 32"},
    {label:"Turnover margin rank", a:ra.turnover.rank, h:rh.turnover.rank, hi:"lo", note:"of 32"}
  ];
  const bar = r => {
    const x = parseFloat(r.a), y = parseFloat(r.h);
    let pa = 50, ph = 50;
    if (!isNaN(x) && !isNaN(y)){
      if (r.hi === "lo"){ const ix = 1/Math.max(x,.01), iy = 1/Math.max(y,.01); pa = ix/(ix+iy)*100; }
      else { const lo = Math.min(x,y,0), sx = x-lo, sy = y-lo; pa = (sx+sy)===0 ? 50 : sx/(sx+sy)*100; }
      ph = 100-pa;
    }
    const aw = !isNaN(x)&&!isNaN(y)&&x!==y ? (r.hi==="lo" ? x<y : x>y) : false;
    const hw = !isNaN(x)&&!isNaN(y)&&x!==y ? (r.hi==="lo" ? y<x : y>x) : false;
    const fmt = v => (r.hi==="sign" && typeof v==="number" && v>0) ? "+"+v : v;
    return `<div class="sbar">
      <div class="sv ${aw?"win":""}">${fmt(r.a)}</div>
      <div class="mid"><span class="lb">${r.label}</span>
        <span class="track"><i style="width:${pa}%;background:${a.color}"></i><i style="width:${ph}%;background:${hm.color}"></i></span>
        ${r.note?`<span class="nt">${r.note}</span>`:""}</div>
      <div class="sv ${hw?"win":""}">${fmt(r.h)}</div>
    </div>`;
  };
  const sc = (g.awayScore!=null) ? ` &middot; Final ${g.awayScore}-${g.homeScore}` : "";
  document.getElementById("ovbox").innerHTML = `
    <div class="ovhd">
      <div>
        <h3 id="ovtitle">${a.name} at ${hm.name}</h3>
        <div class="sub">${k.day} &middot; ${k.time} &middot; ${g.tv} &middot; ${g.venue}${sc}${g.line?" &middot; "+g.line:""}</div>
      </div>
      <button class="x" id="ovx" aria-label="Close">&times;</button>
    </div>
    <div class="ovbody">
      <div class="ovlegend">
        <span><i style="background:${a.color}"></i>${a.name}</span>
        <span><i style="background:${hm.color}"></i>${hm.name}</span>
        <span>Green marks the better number</span>
      </div>
      <div class="ovsec">Current rankings</div>
      ${rankRows.map(bar).join("")}
      <div class="ovsec">Team numbers</div>
      ${rows.map(bar).join("")}
      ${(g.keys||[]).length ? `<div class="ovsec">What to watch</div><ul class="ovkeys">${li(g.keys)}</ul>` : ""}
    </div>`;
  document.getElementById("ov").classList.add("on");
  document.body.style.overflow = "hidden";
  document.getElementById("ovx").addEventListener("click", closeStats);
}

  document.getElementById("ov").classList.remove("on");
  document.body.style.overflow = "";

function latestWeekId(){
  const nums = WEEKS.map(w => parseInt((w.id.match(/\d+/)||[0])[0],10)||0);
  return WEEKS[nums.indexOf(Math.max(...nums))].id;
}
function mergeWeeks(list){
  let added = 0;
  list.forEach(d=>{
    if (!d || !d.id || !d.teams) return;
    d.games = d.games || []; d.status = d.status || "live"; d.type = d.type || "recap";
    d.label = d.label || ("Week " + ((d.id.match(/\d+/)||["?"])[0]));
    d.dates = d.dates || ""; d.headline = d.headline || ""; d.intro = d.intro || "";
    const i = WEEKS.findIndex(x=>x.id===d.id);
    if (i >= 0) WEEKS[i] = d; else { WEEKS.push(d); added++; }
  });
  WEEKS.sort((a,b)=>((parseInt((a.id.match(/\d+/)||[0])[0],10)||0)-(parseInt((b.id.match(/\d+/)||[0])[0],10)||0)));
  return added;
}

/* When published, any weeks.json sitting next to this file is loaded and merged.
   Opening the file locally just skips this and uses the weeks baked in above. */
(function loadHosted(){
  if (!window.fetch || !/^https?:$/.test(location.protocol)) return;
  fetch("weeks.json", {cache:"no-store"})
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data) return;
      const list = Array.isArray(data) ? data : [data];
      if (!mergeWeeks(list)) return;
      buildNav();
      show(latestWeekId());
    })
    .catch(()=>{});
})();
