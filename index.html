<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 NFL Season Tracker</title>
<meta name="description" content="Week by week breakdown of all 32 NFL teams: last game, positives, negatives, and what is next. Updated every week.">
<meta name="theme-color" content="#E4E4DE">
<meta property="og:type" content="website">
<meta property="og:title" content="2026 NFL Season Tracker">
<meta property="og:description" content="All 32 teams, week by week. Last game, positives, negatives, and what is next.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233D3730'/%3E%3Cpath d='M6 16h20M16 6v20' stroke='%23F4F2EC' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%232F6B4F' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nxt:#31597F; --nxt-ink:#2A4E70; --nxt-bg:#E9EFF6; --nxt-line:#C6D6E7;
  --bg:#F4F2EC; --surface:#FFFFFF; --surface-2:#EDEAE2; --surface-3:#E4E0D6;
  --ink:#332E29; --ink-2:#6B6459; --ink-3:#9A9287; --line:#E2DED5; --line-2:#D3CEC3;
  --pro:#1C7F58; --pro-ink:#155E42; --pro-bg:#E6F3EC; --pro-line:#BFE1D0;
  --con:#C4472F; --con-ink:#93341F; --con-bg:#FBEBE6; --con-line:#F0C6BB;
  --neu-bg:#F6F4EF; --neu-line:#E6E2D9;
  --r:16px; --r-s:10px;
  --shadow:0 1px 2px rgba(51,46,41,.05),0 8px 24px -12px rgba(51,46,41,.16);
  --shadow-hover:0 2px 4px rgba(51,46,41,.06),0 18px 36px -14px rgba(51,46,41,.24);
  --maxw:1280px;
}
html{box-sizing:border-box;scroll-behavior:smooth;scroll-padding-top:150px}
*,*:before,*:after{box-sizing:inherit}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
h1,h2,h3,h4,h5,.num{font-family:"Space Grotesk","Manrope",sans-serif;margin:0;letter-spacing:-.01em}
button{font-family:inherit}
a{color:inherit}

/* ---------- app bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:rgba(244,242,236,.86);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.bar-in{max-width:var(--maxw);margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.brand{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:9px}
.brand i{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#1C7F58,#C4472F);display:inline-block}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 320px;min-width:0;padding:3px;background:var(--surface-2);border-radius:999px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.wtab{flex:0 0 auto;border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.wtab:hover{color:var(--ink)}
.wtab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(51,46,41,.08),0 2px 8px -2px rgba(51,46,41,.12)}
.wtab[disabled]{color:var(--ink-3);cursor:default;opacity:.7}
.wtab[disabled]:hover{color:var(--ink-3)}
.wtab.sample{font-style:italic}
.wtab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tools-right{display:flex;gap:10px;align-items:center;flex:0 1 auto;margin-left:auto}
.search{position:relative;flex:1 1 220px;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3);pointer-events:none}
#q{width:100%;font:inherit;font-size:14px;font-weight:500;padding:9px 34px 9px 36px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;transition:box-shadow .15s,border-color .15s}
#q::placeholder{color:var(--ink-3)}
#q:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 4px rgba(51,46,41,.08)}
#qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-2);cursor:pointer;display:none;font-size:14px;line-height:1}
#qx.on{display:block}
#qx:hover{background:var(--surface-3);color:var(--ink)}
.seg{display:flex;padding:3px;background:var(--surface-2);border-radius:999px}
.chip{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(51,46,41,.08)}
.chip:focus-visible,#q:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- results banner ---------- */
.results{display:none;margin:22px 0 -10px;padding:12px 16px;border-radius:var(--r-s);background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.results.on{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.results .nav{display:flex;gap:4px;align-items:center;margin-left:auto}
.results .nav button{margin:0;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.results .nav .pos{font-size:13px;color:var(--ink-3);font-weight:600;min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
.results .nav button[disabled]{opacity:.4;cursor:default}
mark.hit{background:#F7E39C;color:var(--ink);border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px #E9CE72}
mark.hit.cur{background:#F2B441;box-shadow:0 0 0 2px #D8952A}
.card.hasCur{box-shadow:0 0 0 2px #E0A93C, var(--shadow-hover)}
.results b{color:var(--ink);font-family:"Space Grotesk",sans-serif}
.results button{margin-left:auto;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.results button:hover{color:var(--ink);border-color:var(--ink-2)}
body.searching .nosearch{display:none!important}

/* ---------- page head ---------- */
.pagehead{padding:40px 0 8px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--pro)}
.eyebrow.sample i{background:var(--con)}
.pagehead h2{font-size:clamp(30px,4.4vw,44px);font-weight:700;line-height:1.08;letter-spacing:-.02em;max-width:22ch}
.pagehead p{max-width:74ch;color:var(--ink-2);margin:14px 0 0;font-size:15.5px}
.sampleflag{margin-top:16px;border-radius:var(--r-s);background:var(--con-bg);border:1px solid var(--con-line);color:var(--con-ink);padding:11px 14px;font-size:14px;max-width:74ch}

/* ---------- section head ---------- */
.sec{padding-top:34px}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h3{font-size:22px;font-weight:700}
.sec-head p{margin:0;font-size:13.5px;color:var(--ink-3)}

/* ---------- slate ---------- */
.slate{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.slot{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;transition:transform .15s,box-shadow .15s,border-color .15s}
.slot:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--line-2)}
.slot .when{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.slot .vs{font-family:"Space Grotesk",sans-serif;font-size:19px;font-weight:700;margin:4px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
.slot .vs em{font-style:normal;font-weight:500;color:var(--ink-3);font-size:14px}
.slot .vs i{width:12px;height:12px;border-radius:4px;display:inline-block;flex:0 0 12px}
.slot .score{margin-left:auto;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:18px}
.slot .note{font-size:13px;color:var(--ink-2);line-height:1.45}

/* ---------- game block ---------- */
.game{margin-top:40px;scroll-margin-top:110px}
.game-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.game-head h3{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.game-head h3 i{width:14px;height:14px;border-radius:4px;display:inline-block}
.game-head h3 em{font-style:normal;font-weight:500;color:var(--ink-3);font-size:15px}
.game-head .meta{font-size:13px;color:var(--ink-3);margin-left:auto;font-weight:500}
.game-note{font-size:14px;color:var(--ink-2);margin:0 0 14px}
.pair{display:grid;gap:14px}
@media(min-width:1040px){.pair{grid-template-columns:1fr 1fr}}

/* ---------- team card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:110px;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow-hover)}
.card.hide{display:none}
.card-top{padding:18px 20px 14px;position:relative}
.card-top::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#fff))}
.card-top .row{display:flex;align-items:flex-start;gap:14px}
 .badge{width:44px;height:44px;border-radius:12px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;color:#fff;background:var(--tc);}
.card-top h4{font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.015em}
.card-top .sub{font-size:14px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{display:inline-flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;color:var(--ink-2);font-weight:600}
.pill b{font-family:"Space Grotesk",sans-serif;font-size:13.5px;color:var(--ink);font-weight:700}
.pill.win b{color:var(--pro-ink)}.pill.loss b{color:var(--con-ink)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;padding:0 12px 12px}
.panel{border-radius:12px;padding:14px 16px 12px;background:var(--neu-bg);border:1px solid var(--neu-line)}
.panel.up{background:var(--pro-bg);border-color:var(--pro-line)}
.panel.down{background:var(--con-bg);border-color:var(--con-line)}
.panel h5{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.panel.up h5{color:var(--pro-ink)}.panel.down h5{color:var(--con-ink)}
.panel h5 svg{width:14px;height:14px}
.panel ul{margin:0;padding:0;list-style:none}
.panel li{position:relative;padding-left:14px;margin-bottom:9px;font-size:14px;line-height:1.55;color:var(--ink)}
.panel li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.panel.up li::before{background:var(--pro)}.panel.down li::before{background:var(--con)}
.panel li:last-child{margin-bottom:0}
.panel li strong{font-weight:700}
.pending{font-size:13px;color:var(--ink-3);padding:6px 0}
.panel.next{background:var(--nxt-bg);border-color:var(--nxt-line)}
.panel.next h5{color:var(--nxt-ink)}
.panel.next h5 .wk{margin-left:auto;font-weight:600;color:var(--nxt);opacity:.72;letter-spacing:0;text-transform:none}
.gradecap{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--nxt);opacity:.7;margin-bottom:6px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:13px}
.grade{background:var(--surface);border:1px solid var(--nxt-line);border-radius:10px;padding:7px 9px 6px;text-align:center}
.grade .lab{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--nxt);opacity:.72;display:block}
.grade .val{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:20px;line-height:1.15;letter-spacing:-.02em;display:block;margin-top:1px}
.grade .val sup{font-size:10px;font-weight:600;color:var(--ink-3);margin-left:1px;top:-.55em}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;line-height:1;padding:2px 6px;border-radius:999px;margin-top:3px}
.delta.up{background:var(--pro-bg);color:var(--pro-ink)}
.delta.down{background:var(--con-bg);color:var(--con-ink)}
.delta.flat{background:#DDE6F0;color:var(--nxt-ink)}
.delta.none{visibility:hidden}
.nextrow{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.nextrow .badge{width:38px;height:38px;flex:0 0 38px;border-radius:10px;font-size:12px}
.nextrow .who{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:17px;line-height:1.15;letter-spacing:-.01em}
.nextrow .who em{font-style:normal;font-weight:500;color:var(--ink-3);font-size:13px;margin-right:5px}
.nextrow .whn{font-size:12.5px;color:var(--nxt-ink);font-weight:600;margin-top:2px}
.nextvenue{font-size:12.5px;color:var(--nxt);opacity:.66;margin:0 0 10px}
.panel.next p{margin:0;font-size:14px;line-height:1.55;color:var(--ink)}
.panel.next p+p{margin-top:8px}

/* ---------- guide ---------- */
.div-block{margin-top:40px}
.div-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.div-head h3{font-size:20px;font-weight:700}
.div-head span{font-size:13px;color:var(--ink-3)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;background:var(--surface);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
th:hover,th[aria-sort]{color:var(--ink)}
th[aria-sort="ascending"]::after{content:"\2191";margin-left:5px}
th[aria-sort="descending"]::after{content:"\2193";margin-left:5px}
td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);color:var(--ink-2);white-space:nowrap;font-family:"Space Grotesk",sans-serif;font-weight:500}
td:first-child{font-family:"Manrope",sans-serif}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--neu-bg)}
td a{color:var(--ink);text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:10px}
td a:hover{text-decoration:underline}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.pos{color:var(--pro-ink)}.neg{color:var(--con-ink)}

/* ---------- data tools ---------- */
.tools{margin-top:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.tools>summary{cursor:pointer;padding:16px 20px;font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
.tools>summary::-webkit-details-marker{display:none}
.tools>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-left:auto;transition:transform .15s}
.tools[open]>summary::after{transform:rotate(-135deg)}
.tools-body{padding:0 20px 20px;border-top:1px solid var(--line)}
.tools-body p{font-size:14px;color:var(--ink-2);max-width:82ch;margin:14px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{font-size:13.5px;font-weight:700;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;transition:opacity .15s,transform .15s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink-2);opacity:1}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
textarea{width:100%;min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;padding:12px;border:1px solid var(--line-2);background:var(--neu-bg);color:var(--ink);border-radius:12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 4px rgba(51,46,41,.08)}
.status{font-size:13.5px;color:var(--pro-ink);min-height:20px;margin-top:8px;font-weight:600}
.status.err{color:var(--con-ink)}
.hint{font-size:13px;color:var(--ink-3);margin-top:6px}

.empty{display:none;padding:56px 0;text-align:center;color:var(--ink-3)}
.empty.on{display:block}
footer{margin:56px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-3);max-width:82ch}
footer h4{font-size:15px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
footer p{margin:0 0 10px}
main{padding-bottom:90px}
.top{position:fixed;right:20px;bottom:20px;z-index:40;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--shadow);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.top:hover{box-shadow:var(--shadow-hover)}
@media(max-width:720px){
  .wrap{padding:0 14px}.bar-in{padding:10px 14px}
  .tools-right{flex:1 1 100%;margin-left:0}
  .card-top h4{font-size:20px}.pagehead h2{max-width:none}
  html{scroll-padding-top:190px}.card,.game{scroll-margin-top:190px}
}
@media print{.bar,.top,.tools{display:none}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brand"><i></i>2026 NFL Tracker</div>
    <div class="tabs" id="weeknav" role="tablist" aria-label="Week"></div>
    <div class="tools-right">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search team, coach, player" aria-label="Search" autocomplete="off">
        <button id="qx" aria-label="Clear search">&times;</button>
      </div>
      <div class="seg" role="group" aria-label="Conference">
        <button class="chip" data-conf="all" aria-pressed="true">All</button>
        <button class="chip" data-conf="AFC" aria-pressed="false">AFC</button>
        <button class="chip" data-conf="NFC" aria-pressed="false">NFC</button>
      </div>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="results" id="results"></div>
  <div id="view"></div>
</main>
<button class="top" id="top" aria-label="Back to top">&uarr;</button>

<script>
const TEAMS = [
/* ============================ AFC EAST ============================ */
{
  ab:"NE", name:"New England Patriots", conf:"AFC", div:"AFC East", color:"#002244",
  rec:"14-3", pf:490, pa:320, pd:170, srs:5.5, wt:10.5, rank:10,
  sub:"Mike Vrabel, year two. Lost Super Bowl LX.",
  facts:[
    "Went 14-3 and reached the Super Bowl in Mike Vrabel's first season, losing to Seattle. It was the joint best record in the league alongside Denver and Seattle.",
    "That run came against one of the softest schedules in the NFL. The 2026 slate is projected sixth hardest, and the SRS of 5.5 sits well below their raw record.",

     Negatives (what came out of the game against them)         tone "down"

/* ---------- AFC EAST ---------- */
NE:{headline:"Opens the season where it ended, at Lumen Field", sections:P3(
  ["At Seattle, Wednesday 8:20 PM ET on NBC. A rematch of Super Bowl LX seven months later, in the building of the team that beat them 29-13.","That night New England scored zero first-half points on four first downs and 51 yards, the third fewest in a Super Bowl half. Drake Maye finished with 295 yards and two touchdowns but three turnovers and six sacks.","<strong>A.J. Brown</strong> makes his Patriots debut. First-round tackle <strong>Caleb Lomu</strong> was drafted to fix the protection this exact matchup exposed."],
  ["Brown gives Maye a true outside No. 1 for the first time. Romeo Doubs and the tight ends fill in behind him.","The defense returns most of a unit that allowed 320 points, sixth fewest in the league, built around CB Christian Gonzalez and DT Milton Williams.","Continuity on both coordinator staffs in year two under Vrabel is a real September edge."],
  ["Rookie RB <strong>TreVeyon Henderson</strong> missed consecutive practices with an ankle and is in real danger of sitting. Rhamondre Stevenson carries the load with recent trade pickup Corey Kiner the only other back.","The 14-3 record came against a soft schedule and this year's slate projects sixth hardest. SRS of 5.5 says they were closer to an 11-win team.","Kyle Dugger left for Pittsburgh, thinning the safety room."]
)},
SEA:{headline:"Defending champions host the team they beat", sections:P3(
  ["Home against New England, Wednesday 8:20 PM ET on NBC. First Wednesday opener since 2012.","Seattle beat New England 29-13 in Super Bowl LX. Jason Myers kicked five field goals, a Super Bowl record, and did all the scoring through three quarters. Kenneth Walker III ran for 135 and won MVP.","Best SRS in football last year at 12.8 and the fewest points allowed at 292."],
  ["<strong>Jaxon Smith-Njigba</strong> is the reigning Offensive Player of the Year after 119 catches and a league-leading 1,793 yards, and the passing game returns intact.","<strong>Mike Macdonald</strong> is regarded as one of the best coaches in the game and the defense was historically good.","They already beat the Rams twice in one season, which is the specific test the division comes down to again."],
  ["OC <strong>Klint Kubiak</strong> left for the Raiders head job, rated the most damaging departure of the offseason. The replacement is unproven.","Walker signed with Kansas City and <strong>Zach Charbonnet</strong> is on PUP for four games, so rookie <strong>Jadarian Price</strong> is the lead back with George Holani spelling him.","Lost edge Boye Mafe and DBs Coby Bryant and Riq Woolen. CB <strong>Terrion Arnold</strong>, acquired from Detroit, is on the commissioner exempt list. Win total dropped three and a half games to 10.5."]
)},
BUF:{headline:"Joe Brady's first game as a head coach", sections:P3(
  ["At Houston, Sunday 1:00 PM ET on CBS. Buffalo has not won in Houston since 2006.","<strong>Joe Brady</strong> makes his head coaching debut after the Sean McDermott firing, against the AFC's best scoring defense from 2025.","Buffalo went 12-5, lost the division for the first time since 2019, and fell at Denver in overtime in the divisional round."],
  ["<strong>James Cook</strong> led the NFL with 1,621 rushing yards and <strong>D.J. Moore</strong> arrives as the first real No. 1 receiver Josh Allen has had since 2023.","Brady already ran this offense, so there is no scheme reset to work through.","<strong>Bradley Chubb</strong> and 35th pick <strong>T.J. Parker</strong> replace the lost pass rush. Buffalo has cleared its win total six straight years and sits at 10.5 again."],
  ["Safety <strong>C.J. Gardner-Johnson</strong> strained a calf in August and GM Brandon Beane says he is now dealing with a different injury. He may not play.","LB <strong>Terrel Bernard</strong> is uncertain with an undisclosed late-camp injury. WR Khalil Shakir has an undisclosed issue, though the team is optimistic.","First-time head coach, first time building a staff, and a road opener against a top-two defense is close to the worst possible draw."]
)},
HOU:{headline:"Best defense in the AFC hosts Buffalo", sections:P3(
  ["Home against Buffalo, Sunday 1:00 PM ET on CBS.","Houston started 0-3 in 2025, then won 12 of 14 including a nine game closing streak, before losing to New England in the divisional round.","Allowed 295 points, second fewest in the AFC. DSRS of 7.2 led the conference outright."],
  ["The defense is the most complete unit in the division and one of the best in the league, and it faces a Buffalo offense breaking in a new head coach.","Four of the first six draft picks went to the trenches, headlined by guard <strong>Keylan Rutledge</strong> at 26, which is exactly the criticism this roster faced for two years.","<strong>David Montgomery</strong> arrives from Detroit as the closing-game back a low-scoring team needs. Third straight year of 10-plus wins."],
  ["<strong>Jayden Higgins</strong> tore his ACL in camp and is out for the season. The team traded for <strong>Kayshon Boutte</strong>, who starts opposite Nico Collins with Jaylin Noel in the slot.","<strong>Tank Dell</strong> and OT <strong>Braden Smith</strong> both opened on injured reserve for at least four games. The line starts two rookies and just lost a tackle.","The open question analysts keep circling: is C.J. Stroud a top-tier quarterback or a good one on a great defense?"]
)},
NYJ:{headline:"Geno Smith debuts against a fellow rebuild", sections:P3(
  ["At Tennessee, Sunday 1:00 PM ET on CBS. Two of last season's three-win teams open against each other.","<strong>Geno Smith</strong> makes his Jets debut after arriving from Las Vegas. Aaron Glenn survived 3-14 and is coaching for his job.","New York scored 300 points and allowed 503 last year, the worst differential in the league outside Las Vegas."],
  ["No. 2 overall pick <strong>David Bailey</strong> has been the most talked about rookie pass rusher of camp. <strong>Minkah Fitzpatrick</strong> arrived by trade and signed a three year, $40 million extension.","Smith is a functional starter, a large upgrade over 2025. Rookies <strong>Omar Cooper Jr.</strong> and TE <strong>Kenyon Sadiq</strong> are the young pass catchers, and Younghoe Koo is the kicker.","Enters the season healthy at the skill positions. Sharp Football moved them up two spots out of camp."],
  ["Depth is thin nearly everywhere. One injury at quarterback puts them right back where they were.","Trading Sauce Gardner returned two first-round picks but stripped the one elite player on the defense.","Most projections top out near seven wins against a 5.5 total. The ceiling here is respectability."]

TEN:{headline:"Saleh and Daboll begin the Cam Ward rebuild", sections:P3(
  ["Home against the Jets, Sunday 1:00 PM ET on CBS.","<strong>Robert Saleh</strong>'s head coaching debut with <strong>Brian Daboll</strong> calling plays. Tennessee scored 284 points last year against the hardest schedule in the league.","No major injuries reported entering the opener."],
  ["<strong>Cam Ward</strong> finally has weapons. <strong>Carnell Tate</strong> went fourth overall and <strong>Wan'Dale Robinson</strong> signed for four years and $78 million to reunite with Daboll.","The draft class was one of the most praised in the league. Edge <strong>Keldric Faulk</strong> (31st) and LB <strong>Anthony Hill Jr.</strong> (60th) project as immediate starters, and DL <strong>John Franklin-Myers</strong> signed a large deal.","A Jets opener is as winnable as this schedule gets."],
  ["Still a bottom-five roster in most evaluations. Two good hires do not close a 194-point gap in one year.","Cornerback spending was the most criticized part of the offseason. Analysts think they paid market rate for below-market play.","Ward is learning a new system with a new play caller in the same building he struggled in. Total is 6.5."]
)},
MIA:{headline:"Malik Willis starts a full teardown", sections:P3(
  ["At Las Vegas, Sunday 4:25 PM ET on FOX. Two rookie head coaches in <strong>Jeff Hafley</strong> and Klint Kubiak.","<strong>Malik Willis</strong> begins his run as Miami's starter. Tagovailoa, Waddle, Hill, Fitzpatrick, Phillips, and Chubb are all gone.","Ranked last or near-last in most preseason power rankings with the joint lowest win total at 4.5."],
  ["Hafley ran a top ten defense in Green Bay twice and the defensive free agent additions were the better-regarded half of the offseason.","First-round tackle <strong>Kadyn Proctor</strong> is a decade-long fixture if he hits. Thirteen picks plus a clean cap sheet is where a rebuild wants to be.","Rookie WR Chris Bell is back from a torn ACL and off the NFI list, easing in as a rotational piece with Jalen Tolbert."],
  ["The receiver room is widely rated the weakest in the league, which makes evaluating Willis close to impossible.","Second hardest projected schedule in the NFL.","Any veteran still on the roster is a trade candidate by October, which usually makes the record worse before it gets better."]

LV:{headline:"Kirk Cousins starts, Mendoza waits", sections:P3(
  ["Home against Miami, Sunday 4:25 PM ET on FOX.","<strong>Kirk Cousins</strong> starts and No. 1 overall pick <strong>Fernando Mendoza</strong> opens as the backup. <strong>Klint Kubiak</strong> coaches his first game months after calling plays for a Super Bowl winner.","Las Vegas scored 241 points last year, fewest in the league, and allowed 432."],
  ["Mendoza is the most regarded quarterback prospect in several drafts and does not have to be rushed.","The line rebuild around center <strong>Tyler Linderbaum</strong> directly addresses why the offense could not score. $281.5 million went out on the first day of free agency.","Ashton Jeanty and Maxx Crosby are real building blocks who were wasted on a three-win roster."],
  ["<strong>Ashton Jeanty</strong> suffered an ankle injury in camp that was first feared to be worse. Kubiak is optimistic he plays, but rookie Mike Washington carved out a role and could eat into the workload.","The strongest division in football. Even a much better team can finish 5-11 here.","The only win total on the board to move in the final three weeks of preseason, down a full game to 5.5."]
)},

/* ---------- AFC NORTH ---------- */
BAL:{headline:"Jesse Minter's first game after 18 years of Harbaugh", sections:P3(
  ["At Indianapolis, Sunday 1:00 PM ET on CBS.","<strong>Jesse Minter</strong>'s head coaching debut. This is the first Ravens game since 2007 without John Harbaugh on the sideline.","Baltimore went 8-9 with <strong>Lamar Jackson</strong> missing four games and playing hurt in others, yet still outscored opponents by 26."],
  ["A healthy Jackson plus a positive point differential in a losing season is the textbook bounce-back profile, and the market agrees with an 11.5 win total.","<strong>Trey Hendrickson</strong> signed to fix the pass rush, the defense's clearest 2025 failure. <strong>Jaire Alexander</strong> and Tre'Davious White rebuilt the corner room cheaply.","No significant injuries reported. Zay Flowers had a quad contusion in camp and was day to day."],
  ["Eighteen years of institutional stability walked out the door, and OC Todd Monken left for the Browns head job. The offensive identity is being rebuilt.","Jackson's durability is now a live question, and there is no version of 11.5 wins with a backup.","The market has priced in the bounce-back fully. Very little room for anything to go wrong."]
)},
IND:{headline:"Daniel Jones back from the injury that ended the season", sections:P3(
  ["Home against Baltimore, Sunday 1:00 PM ET on CBS.","Indianapolis started 7-1 and held the AFC's top seed after Week 8, then lost eight of nine including a seven-game closing streak after <strong>Daniel Jones</strong> went down.","Jones signed a two-year, $88 million extension and starts. Shane Steichen and Chris Ballard were both retained."],
  ["The offense scored 466 points, fourth most in the AFC. OSRS of 5.9 says the collapse was about who was on the field.","<strong>Sauce Gardner</strong>, acquired for two first-round picks, is a true shutdown corner who changes what a defense can call.","WR <strong>Alec Pierce</strong> (ankle) is expected to be active after signing a four-year extension. A 7.5 win total gives a healthy season plenty of room."],
  ["Pierce missed most of the offseason and preseason, and <strong>Michael Pittman Jr.</strong> was traded to Pittsburgh, so the receiver room is thin behind Josh Downs.","DSRS was negative in 2025 and the front seven still has holes despite the Gardner investment.","Nobody in the building is coaching with a clean slate after a seven-game losing streak."]
)},
PIT:{headline:"Mike McCarthy and Aaron Rodgers, reunited", sections:P3(
  ["Home against Atlanta, Sunday 1:00 PM ET on FOX. Two new head coaches.","<strong>Mike McCarthy</strong>'s first game replacing Mike Tomlin. <strong>Aaron Rodgers</strong> starts, reuniting with McCarthy from their Green Bay years.","Pittsburgh won the AFC North at 10-7 with a plus 10 differential, the thinnest of any division winner."],
  ["The receiver room was rebuilt around Rodgers with <strong>Michael Pittman Jr.</strong> by trade and rookie <strong>Germie Bernard</strong>. First-round tackle <strong>Max Iheanachor</strong> addresses a line that has capped this offense for years.","If <strong>T.J. Watt</strong> returns to form the defense has a top-five ceiling, and Kyle Dugger signed from New England.","No significant injuries reported. QB <strong>Drew Allar</strong> (76th pick) is the succession plan."],
  ["A plus 10 differential and an SRS of 0.1 in a 10-win season is the clearest regression signal on the board.","Rodgers at this stage carries obvious physical and locker room risk, and McCarthy's Dallas tenure ended without a deep run.","Analyst rank of 20 sits well below the public perception of this roster."]
)},
ATL:{headline:"Tua starts, Penix inactive", sections:P3(
  ["At Pittsburgh, Sunday 1:00 PM ET on FOX.","<strong>Tua Tagovailoa</strong> starts. <strong>Michael Penix Jr.</strong> is inactive, and per Rapoport he did not believe he was ready. The expectation is that Penix takes over once healthy.","<strong>Kevin Stefanski</strong>'s first game in Atlanta after two Coach of the Year awards in Cleveland. Atlanta closed 2025 on a four-game winning streak."],
  ["<strong>Bijan Robinson</strong>, <strong>Drake London</strong>, and second-team All-Pro <strong>Kyle Pitts</strong> is a genuinely good skill trio that underperformed its personnel under the last staff.","Stefanski is one of the more respected hires of the cycle, and the NFC South has been won with eight wins two years running.","CB <strong>Avieon Terrell</strong> (48th) joins his brother A.J. in the secondary."],
  ["The quarterback room is the worst kind: two options, neither clearly better, and the starter named out of necessity.","No first-round pick as a result of the 2025 trade up for James Pearce Jr., and the defense finished with a negative DSRS.","Win total dropped to 6.5 despite the strong finish. Analyst rank sits at 28."]
)},
CIN:{headline:"Burrow's first game back, and a funded defense", sections:P3(
  ["Home against Tampa Bay, Sunday 1:00 PM ET on FOX.","<strong>Joe Burrow</strong>'s first regular season game since the injury that cost him nine starts. The offense still scored 414 points without him for most of the year.","The only AFC North team that did not change head coaches."],
  ["The defensive rebuild finally got funded: DT <strong>Dexter Lawrence II</strong> by trade and edge <strong>Boye Mafe</strong> from Seattle, plus rookies Cashius Howell and Tacario Davis.","<strong>Ja'Marr Chase</strong> (knee) and <strong>Tee Higgins</strong> (heel) both practiced Monday and are tracking to play without restriction.","Third easiest projected schedule in the league. Even a middling defense makes this a playoff team."],
  ["The offensive line is still the unresolved question and the reason the injury risk never fully goes away.","Allowed 492 points last year. One offseason of spending does not undo a bottom-tier back seven.","Analysts who have been low on Cincinnati stayed low. Sharp has them 11th against a 10.5 total."]
)},
TB:{headline:"Baker Mayfield healthy, Mike Evans gone", sections:P3(
  ["At Cincinnati, Sunday 1:00 PM ET on FOX.","Tampa Bay started 6-2 in 2025, then lost seven of nine and missed the playoffs. <strong>Baker Mayfield</strong> played hurt through the collapse and is expected back healthy.","<strong>Mike Evans</strong> signed with San Francisco, ending a franchise era."],
  ["<strong>Rueben Bain Jr.</strong> (15th) was the most productive edge rusher in the draft and fills the defense's clearest need immediately.","Most analysts have them as the best team in the NFC South.","WR <strong>Emeka Egbuka</strong> missed three weeks with turf toe but practiced Monday and is expected to play, likely with a designation."],
  ["Replacing Evans is not solved. The receiver room is young and unproven behind Godwin and Egbuka.","Second-half collapses have happened in consecutive seasons under this staff.","DSRS was negative and the secondary is the thinnest part of the roster. Total is 8.5."]
)},
CLE:{headline:"Todd Monken's debut with the QB room settled", sections:P3(
  ["At Jacksonville, Sunday 1:00 PM ET on CBS.","<strong>Todd Monken</strong>'s first game as a head coach. <strong>Deshaun Watson</strong> starts with Shedeur Sanders backing up. Monken named him August 25 and said it is not a week to week call.","Cleveland scored 279 points last year, second fewest in the league."],
  ["The line was rebuilt in earnest: guard <strong>Zion Johnson</strong> near $50 million over three years and tackle <strong>Spencer Fano</strong> at No. 9.","Edge <strong>Jared Verse</strong> came back in the Garrett trade and 2025 Defensive Rookie of the Year <strong>Carson Schwesinger</strong> anchors the second level.","Easiest projected schedule in the NFL. Rookies Denzel Boston and KC Concepcion start alongside Jerry Jeudy."],
  ["There is no credible starting quarterback on the roster. Analysts are near-unanimous that Watson cannot be the plan.","Losing Myles Garrett and DC Jim Schwartz in one offseason strips the defense of its best player and its architect.","WR Isaiah Bond was evaluated for a concussion in the preseason finale. Total is 5.5, analyst rank 31."]
)},
JAX:{headline:"Defending the division after a four-win jump", sections:P3(
  ["Home against Cleveland, Sunday 1:00 PM ET on CBS.","Liam Coen's second season after taking Jacksonville from four wins to 13 and the AFC South title. Lost at home to Buffalo in the wild card round.","SRS of 8.7 was the best in the division and third in the AFC."],
  ["Coen's system produced immediate improvement and the core of the offense is intact. Trevor Lawrence gets a full offseason in a scheme that worked.","<strong>Jakobi Meyers</strong>, extended for three years and $60 million after the deadline trade, is a captain. Brian Thomas Jr. is back for the opener. Traded for CB <strong>Tyson Campbell</strong>.","A Cleveland opener against the league's weakest projected roster is a favorable start."],
  ["RB <strong>LeQuint Allen Jr.</strong> (soft tissue) is unlikely to play. Coen said he would be pleasantly surprised, so Bhayshul Tuten inherits the third-down role.","Lost leading back <strong>Travis Etienne Jr.</strong> to New Orleans and LB <strong>Devin Lloyd</strong> to Carolina.","Turnover luck is the central bear case. The win total dropped four games to 8.5, and Houston looks like the more complete roster."]
)},

/* ---------- AFC WEST ---------- */
DEN:{headline:"Monday night at Arrowhead to open the year", sections:P3(
  ["At Kansas City, Monday 8:15 PM ET on ESPN and ABC.","Denver tied for the league's best record at 14-3 and reached the AFC Championship Game. Eleven of those wins came by one score, tying an NFL record.","Denver expects Mahomes at full strength. Josh Simmons is not expected to start at tackle for Kansas City."],
  ["<strong>Jaylen Waddle</strong>, acquired for first, third, and fourth round picks, gives Bo Nix a separator on the outside for the first time.","The defense allowed 311 points and returns largely intact with a DSRS of 3.5 and no reliance on expiring deals.","Sean Payton has a ring and Denver's home field is one of the AFC's hardest, though the opener is on the road."],
  ["Eleven one-score wins is the loudest regression signal in the league. SRS of 3.5 tells the real story behind 14-3, and the total dropped four and a half games to 9.5.","OLB <strong>Jonathan Cooper</strong> was placed on the commissioner exempt list and is unavailable.","Analysts remain unconvinced Nix is good enough to lead a Super Bowl team, and the run game is a question."]
)},
KC:{headline:"Mahomes on track but not formally cleared", sections:P3(
  ["Home against Denver, Monday 8:15 PM ET on ESPN and ABC.","<strong>Patrick Mahomes</strong> tore his ACL and LCL in December, took every first team rep in camp, and sat out the preseason by design. Andy Reid said Tuesday there is a good chance he starts. <strong>Justin Fields</strong> goes if he cannot.","Kansas City won six games, its fewest since 2012, on a 1-9 record in one-score games with a positive point differential."],
  ["A 1-9 record in one-score games is close to pure variance. The 10.5 total reflects near-total confidence 2025 was an aberration.","<strong>Kenneth Walker III</strong>, the Super Bowl MVP, fixes a run game that had been missing for seasons, and a run-heavy script early suits Mahomes' return.","CB <strong>Mansoor Delane</strong> (6th) and DT <strong>Peter Woods</strong> (29th) are premium-position rookies on a defense that already had a 3.8 DSRS."],
  ["A quarterback returning from a torn ACL at 31 is not guaranteed to return to form, especially one whose game depends on escapability.","Traded CB Trent McDuffie and guard Joe Thuney, two of the best players at their positions. Simmons not starting at tackle adds to the line worries.","The sharpest critique this year is that the roster is no longer elite and Mahomes has been carrying it."]
)},
LAC:{headline:"Alt and Slater expected back on the field", sections:P3(
  ["Home against Arizona, Sunday 4:25 PM ET on CBS.","Slated to mark the return of All-Pro tackles <strong>Joe Alt</strong> and <strong>Rashawn Slater</strong>, who missed most of 2025. <strong>Mike McDaniel</strong> calls his first game as Chargers coordinator.","Los Angeles won 11 games despite the tackle injuries, with a plus 28 differential."],
  ["Two All-Pro tackles back is functionally a major free agency haul that cost nothing, and McDaniel is one of the most inventive play designers in football.","Justin Herbert is a common top-three MVP pick. Sharp Football ranks them fifth and calls the 9.5 total soft.","New DC <strong>Chris O'Leary</strong> is expected to keep the Minter scheme. Added edge Odafe Oweh, TE Charlie Kolar, DT Dalvin Tomlinson, and RB Keaton Mitchell."],
  ["Center <strong>Tyler Biadasz</strong> is expected out for an extended stretch, so rookie <strong>Jake Slaughter</strong> starts in the middle of the line that was supposed to be the offseason's big fix.","Slater had a knee flare-up in August that cost him more than a week of practice. He is expected to start, but the injury history is real.","A plus 28 differential in an 11-win season says they were closer to average than the record. Losing Minter is still a change."]
)},
ARI:{headline:"Mike LaFleur's debut in a building he knows", sections:P3(
  ["At the Chargers, Sunday 4:25 PM ET on CBS.","<strong>Mike LaFleur</strong>'s first game as a head coach, in the stadium where he spent three years as Rams coordinator. He is Arizona's sixth straight first-time head coach.","<strong>Jacoby Brissett</strong> is the starter after 3,366 yards and 23 touchdowns over the final 12 games of 2025. Kyler Murray was released and signed with Minnesota."],
  ["LaFleur comes from the best offensive staff in football and knows the NFC West intimately.","<strong>Jeremiyah Love</strong> at No. 3 is the highest-drafted back since Saquon Barkley. LaFleur feels good about his availability after an ankle cost him four weeks.","Sharp's read is that the roster is better than Miami's and the quarterback room better than Cleveland's. Some of the low ranking is the division."],
  ["Rookie guard <strong>Chase Bisontis</strong> is out most or all of the season with an MCL injury, forcing Isaiah Adams in at right guard next to newly signed tackle Elijah Wilkinson. The line ranked 26th last year.","Love is listed behind Tyler Allgeier on the depth chart and may be eased in.","The defense allowed 488 points and was not meaningfully addressed. Lowest win total in the league at 3.5 against the fourth hardest schedule."]
)},

/* ---------- NFC EAST ---------- */
PHI:{headline:"First game of the post A.J. Brown era", sections:P3(
  ["Home against Washington, Sunday 4:25 PM ET on FOX. A divisional opener.","Philadelphia won the NFC East at 11-6 but started 8-2 and lost five of its last eight before a wild card exit to San Francisco.","<strong>A.J. Brown</strong> was traded to New England. <strong>DeVonta Smith</strong> steps into the No. 1 role, with rookie <strong>Makai Lemon</strong>, TE <strong>Eli Stowers</strong>, <strong>Dontayvion Wicks</strong>, and Hollywood Brown behind him."],
  ["May be the best defense in the NFC after adding edge <strong>Jonathan Greenard</strong> and CB <strong>Riq Woolen</strong> to a unit that already had the conference's third best DSRS.","The bar for the offense is low. It scored only 379 points last year with Brown on it.","No significant injuries reported. Front seven and offensive line continuity remains among the best in football. Cleared 10.5 wins four straight years."],
  ["Losing an alpha receiver rarely improves an offense. Hurts loses his most reliable contested-catch target.","New play caller <strong>Sean Mannion</strong> is an unknown, and the second-half fade is now a pattern that has ended two straight seasons.","Dallas rebuilt its defense and the division is no longer a walk."]
)},
WAS:{headline:"Jayden Daniels opens without his left tackle", sections:P3(
  ["At Philadelphia, Sunday 4:25 PM ET on FOX.","Washington fell from 12 wins and an NFC title game to 5-12. <strong>Jayden Daniels</strong> missed seven games and the team went 2-5 without him.","New DC <strong>Daronte Jones</strong> takes over a unit that allowed 451 points."],
  ["Daniels healthy is the whole difference. The 2024 version of this team went to a conference championship with much the same core.","<strong>Stefon Diggs</strong> plus Terry McLaurin gives the offense a real two-receiver structure.","LB <strong>Sonny Styles</strong> (7th overall, fully guaranteed) projects as an immediate three-down starter. No meaningful injuries reported beyond Tunsil."],
  ["<strong>Laremy Tunsil</strong> is expected to miss most of the season. The offensive line was already the unsolved problem, and now it opens against Philadelphia's front.","Daniels' injury history is two seasons long and his running style is central to the offense.","A minus 95 differential is a lot of ground with both Philadelphia and Dallas looking stronger."]
)},
DAL:{headline:"Sunday night at MetLife with a rebuilt defense", sections:P3(
  ["At the Giants, Sunday 8:20 PM ET on NBC. The 128th regular season meeting in a rivalry dating to 1960.","Dallas went 7-9-1 with the fifth highest scoring offense in football at 27.7 points per game and one of its worst defenses, DSRS minus 8.7.","No significant injuries reported. Dallas enters the season healthy."],
  ["The largest single-offseason defensive talent injection of any team: safety <strong>Caleb Downs</strong> (11th), edge <strong>Malachi Lawrence</strong> (23rd), edge <strong>Rashan Gary</strong> by trade, and <strong>Quinnen Williams</strong> from November.","The Lamb and Pickens pairing is one of the best receiver duos in the league. A minus 40 differential with 471 points scored means a competent defense swings several games.","Sharp moved them up four spots out of camp and calls them underrated."],
  ["Rebuilding a defense that bad in one offseason with two rookies starting is a lot to ask.","Brian Schottenheimer is still unproven, and the 2025 record came against a soft schedule.","The interior defensive line got worse in raw terms after losing Odighizuwa and Thomas."]
)},
NYG:{headline:"John Harbaugh's first game in blue", sections:P3(
  ["Home against Dallas, Sunday 8:20 PM ET on NBC.","<strong>John Harbaugh</strong>'s Giants debut after 18 seasons in Baltimore, with <strong>Matt Nagy</strong> on offense and <strong>Dennard Wilson</strong> on defense.","New York went 4-13. Brian Daboll was fired in November at 2-8."],
  ["Harbaugh is the most accomplished hire of the cycle and inherits a young roster: <strong>Jaxson Dart</strong>, <strong>Cam Skattebo</strong>, <strong>Malik Nabers</strong>.","LB <strong>Arvell Reese</strong> (5th) and guard <strong>Francis Mauigoa</strong> (10th) both project as immediate starters. The class was widely praised.","Thirteen wins over three seasons means the bar for visible improvement is very low. Total is 7.5."],
  ["<strong>Malik Nabers</strong> is coming off the torn ACL from Week 4 of 2025. Latest reporting says he has a chance to play, but practice this week decides it, and the depth behind him is thin.","Trading <strong>Dexter Lawrence</strong> left a hole. The defensive line remains the roster's weak spot.","Dart is unproven and Nagy's record as a coordinator is mixed."]
)},

/* ---------- NFC NORTH ---------- */
CHI:{headline:"Ben Johnson's second season starts in Charlotte", sections:P3(
  ["At Carolina, Sunday 1:00 PM ET on FOX.","Chicago won 11 games and the NFC North in Johnson's first year, then beat Green Bay in the wild card round after trailing 21-3 at half.","Faces the NFL's toughest projected schedule in 2026."],
  ["Johnson's offense scored 441 points in year one and Caleb Williams improved visibly, nearly reaching 4,000 yards.","Safety <strong>Dillon Thieneman</strong> (25th) headlines the class, and Carolina opens without both starting tackles, which favors Chicago's front.","Already beat Green Bay in January, removing a barrier this franchise carried for years."],
  ["Safety <strong>Coby Bryant</strong> is out four to six months after August knee surgery. CB <strong>Kyler Gordon</strong> (calf) and DB Dallis Flowers are also on injured reserve. Veteran Xavier Woods was signed to fill in.","WR <strong>Rome Odunze</strong> has not practiced this week with a leg injury. Johnson is hopeful for Sunday. RB Kyle Monangai is week to week with a hyperextended knee.","Center Drew Dalman retired unexpectedly, so rookie <strong>Logan Jones</strong> snaps to Williams. A plus 26 differential and SRS of 0.5 say this was closer to a nine-win team."]
)},
CAR:{headline:"Defending division champs open without both tackles", sections:P3(
  ["Home against Chicago, Sunday 1:00 PM ET on FOX.","Carolina won the NFC South at 8-9, its first playoff trip since 2017, then lost a wild card shootout to the Rams.","<strong>Tetairoa McMillan</strong> won Offensive Rookie of the Year. TE <strong>Darren Waller</strong> signed a one-year deal in August after six touchdowns in nine games with Miami."],
  ["Traded for edge <strong>Jaelan Phillips</strong> and signed LB <strong>Devin Lloyd</strong>, two genuine difference-makers on a defense that already had a positive DSRS.","Free agent tackle Rasheed Walker and rookie <strong>Monroe Freeling</strong> (19th) matter more than usual given who is out.","Sharp's read is that the roster is solidly mid-pack when judged separately from the doubts about Bryce Young."],
  ["Both starting tackles are out at least four games. <strong>Ikem Ekwonu</strong> is on reserve PUP and <strong>Taylor Moton</strong> on reserve NFI. That is a severe problem for a quarterback who struggles under pressure.","RB Jonathan Brooks has been limited nearly a week with soreness and Chuba Hubbard is questionable, so the backfield is muddied.","Scored only 311 points, fewest of any 2025 playoff team. One outlet has them 32nd."]
)},
DET:{headline:"Opens with both starting safeties on PUP", sections:P3(
  ["Home against New Orleans, Sunday 1:00 PM ET on FOX. A soft opener handed to a last-place finisher.","Detroit fell from 15 wins to 9-8 and last in the NFC North, yet still scored 481 points, second most in the NFC, with a plus 68 differential.","Sixth easiest projected schedule, which is why the total sits at 10.5."],
  ["<strong>Jahmyr Gibbs</strong> put up 1,223 rushing yards, 77 catches, and 18 touchdowns and is the consensus No. 1 fantasy pick. A New Orleans defense with unresolved questions is a good first opponent.","Tackle <strong>Blake Miller</strong> (17th) addresses the unit most hurt by 2025's injuries.","A positive point differential in a 9-8 season means the underlying team was better than the record."],
  ["<strong>Brian Branch</strong> and <strong>Kerby Joseph</strong> opened on PUP and <strong>Terrion Arnold</strong> was traded to Seattle. The secondary is the biggest camp story in the league, and DSRS was already negative.","RB <strong>Isiah Pacheco</strong>, signed to replace David Montgomery, is on injured reserve with a back issue. Brad Holmes said only that he hopes Pacheco returns this year. Jacob Saylors and Sione Vaki are the backups.","Sharp dropped them four spots because of the secondary. A 10.5 total with that back end is the number analysts most often call too high."]
)},
NO:{headline:"Tyler Shough's first season as the unquestioned starter", sections:P3(
  ["At Detroit, Sunday 1:00 PM ET on FOX. A tough road opener.","New Orleans went 5-4 in games <strong>Tyler Shough</strong> started and 1-7 in every other game. He enters as the unquestioned starter under second-year coach Kellen Moore.","Second easiest projected schedule in the NFL."],
  ["The Shough splits are striking. A full season of the quarterback who went 5-4 is a very different team.","<strong>Travis Etienne Jr.</strong> signed from Jacksonville and is set for a heavy Week 1 workload with Kamara sidelined. Devaughn Vele starts opposite Chris Olave.","Moore is in year two of a deliberate youth movement, so the arrow points up even in a mediocre season. Total is 7.5."],
  ["Rookie WR <strong>Jordyn Tyson</strong>, the eighth overall pick, is on injured reserve with a hamstring and misses at least four games.","<strong>Alvin Kamara</strong> (knee) has not practiced and is expected to be inactive.","The defense has significant question marks the front office largely did not address, and it opens against the NFC's second best offense. Only 306 points scored last year."]
)},
GB:{headline:"Opens at Minnesota without Micah Parsons", sections:P3(
  ["At Minnesota, Sunday 4:25 PM ET on CBS.","Green Bay went 9-7-1, lost its final five, then blew a 21-3 halftime lead in the wild card round at Chicago. Second straight one-and-done.","Third hardest projected schedule."],
  ["<strong>Jordan Love</strong> has been the sixth most efficient quarterback in EPA per dropback over the last three seasons. Sharp ranks the team fourth on that basis.","The 2025 team had a positive point differential and lost close games late, a profile that usually improves.","The defensive draft class (CB <strong>Brandon Cisse</strong>, DT Chris McClellan, CB Domani Jackson) targets the secondary that broke in the playoff loss."],
  ["<strong>Micah Parsons</strong> is on a reserve list and unavailable for the first four games.","<strong>Josh Jacobs</strong> is on the commissioner exempt list with a court date moved up to September 10. MarShawn Lloyd is the lead back. WR Dontayvion Wicks was traded to Philadelphia.","Cleared 9.5 wins only twice in five years despite August rankings like this one. An NFLPA report card showed the largest single-season decline on record."]
)},
MIN:{headline:"Kyler Murray starts over J.J. McCarthy", sections:P3(
  ["Home against Green Bay, Sunday 4:25 PM ET on CBS.","<strong>Kyler Murray</strong> starts, a call Kevin O'Connell made in early August. He signed at the veteran minimum after Arizona released him.","Minnesota finished 2025 by winning its final five games. No major injuries reported."],
  ["<strong>Brian Flores</strong> signed an extension. His defense allowed 333 points with a DSRS of 4.2, and Green Bay arrives without Parsons or Jacobs.","Murray at the minimum is one of the best value signings of the offseason. Sharp is explicitly higher on Minnesota with him starting.","<strong>Justin Jefferson</strong> remains the best receiver in football and raises the floor of any quarterback situation."],
  ["Traded edge <strong>Jonathan Greenard</strong> and DT Harrison Phillips. The front will look very different, and rookies are replacing starters.","Scored only 344 points last year, third fewest among winning teams, with an OSRS of minus 3.4.","Both Murray and McCarthy carry durability histories. A competition settled this close to Week 1 is rarely a sign of confidence. Total is 8.5."]
)},

  ["Against San Francisco at the Melbourne Cricket Ground, Thursday 8:35 PM ET on Netflix. Kickoff is 10:35 AM Friday local time. Rams are the designated home team.","<strong>Matthew Stafford</strong> won AP MVP with 4,707 yards and the offense scored a league-high 518 points. Los Angeles lost the NFC Championship Game and enters as Super Bowl favorite.","<strong>Myles Garrett</strong>, who set the single-season sack record with 23, and CB <strong>Trent McDuffie</strong> both debut."],

  ["<strong>Aaron Donald</strong> came out of retirement to rejoin the team but will not play or travel for the opener.","Garrett has practiced only twice since early camp. The knee is worth watching in a game on the other side of the world.","Held the fewest draft picks in the league at five, so there is almost no cheap depth. Stafford is 38 and the roster is built to win now."]

SF:{headline:"Kittle back, Pearsall out, and a flight to Australia", sections:P3(

  ["Getting Purdy, Warner, and Bosa back at once is the biggest health-driven upgrade available to any contender.","<strong>George Kittle</strong> was activated from PUP on August 23 and OC Klay Kubiak said he looks good for Week 1, with managed snaps.","<strong>Mike Evans</strong> and DT <strong>Osa Odighizuwa</strong> fill the two most obvious holes with proven veterans."],

let ACTIVE = "guide";
let conf = "all";

/* ============================ tabs ============================ */
function buildNav(){
  const upcoming = [];
  for (let w = 2; w <= 18; w++) if (!WEEKS.some(x=>x.id==="wk"+w)) upcoming.push(w);
  document.getElementById("weeknav").innerHTML =
    `<button class="wtab" role="tab" data-id="guide">Season guide</button>` +
    WEEKS.map(w=>`<button class="wtab ${w.status==="sample"?"sample":""}" role="tab" data-id="${w.id}">${w.label}</button>`).join("") +
    upcoming.map(w=>`<button class="wtab" role="tab" disabled title="Not published yet">Wk ${w}</button>`).join("");
  document.querySelectorAll(".wtab[data-id]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));
}
function show(id){
  ACTIVE = id;
  document.querySelectorAll(".wtab[data-id]").forEach(b=>b.setAttribute("aria-selected", b.dataset.id===id));
  document.getElementById("view").innerHTML = (id==="guide") ? renderGuide() : renderWeek(WEEKS.find(w=>w.id===id));
  if (id==="guide") wireBoard();
  wireTools();
  apply();
  window.scrollTo({top:0,behavior:"auto"});
}

/* ============================ guide tab ============================ */

  return `

/* ============================ week tab ============================ */
function renderWeek(w){
  if (!w) return `<p class="empty on">That week is not loaded.</p>`;
  const recap = w.type === "recap";
  return `
  <section class="pagehead nosearch">
    <div class="eyebrow ${w.status==="sample"?"sample":""}"><i></i>${w.dates}</div>
    <h2>${w.headline}</h2>
    <p>${w.intro}</p>
    ${w.status==="sample" ? `<p class="sampleflag"><strong>Sample data.</strong> Nothing on this tab is real. It exists to show what a played week looks like before one has been played.</p>` : ""}
  </section>

  <section class="sec nosearch">
    <div class="sec-head"><h3>${recap ? "Results" : "The slate"}</h3><p>${w.games.length} games. Click one to jump to it.</p></div>
    <div class="slate">
      ${w.games.map(g=>{
        const a=T[g.away], h=T[g.home];
        const sc = (g.awayScore!=null&&g.homeScore!=null) ? `<span class="score">${g.awayScore}<em style="color:var(--ink-3);font-weight:500;padding:0 3px">-</em>${g.homeScore}</span>` : "";
        return `<a class="slot" href="#g-${g.away}-${g.home}">
          <div class="when">${g.day} &middot; ${g.time}</div>
          <div class="vs"><i style="background:${a.color}"></i>${a.ab}<em>at</em><i style="background:${h.color}"></i>${h.ab}${sc}</div>
          <div class="note">${g.tv} &middot; ${g.venue}</div></a>`;
      }).join("")}
    </div>
  </section>

  ${w.games.map(g=>{
    const a=T[g.away], h=T[g.home];
    const cards = [g.away,g.home].map(ab=>{
      const entry = w.teams[ab], t = T[ab];
      if (!entry) return teamCard(t, "No writeup loaded for this team yet.", [], weekMini(t,w,ab), nextPanel(w, ab, [], null));
      return teamCard(t, entry.headline, entry.sections, weekMini(t,w,ab), nextPanel(w, ab, entry.nextNote, entry.grades));
    }).join("");
    const sc = (g.awayScore!=null&&g.homeScore!=null) ? `Final ${g.awayScore}-${g.homeScore} &middot; ` : "";
    return `<section class="game" id="g-${g.away}-${g.home}">
      <div class="game-head">
        <h3><i style="background:${a.color}"></i>${a.name}<em>at</em><i style="background:${h.color}"></i>${h.name}</h3>
        <div class="meta">${sc}${g.day} &middot; ${g.time} &middot; ${g.tv}</div>
      </div>
      ${g.note?`<p class="game-note">${g.note}</p>`:""}
      <div class="pair">${cards}</div>
    </section>`;
  }).join("")}

  <p class="empty" id="empty">No team matches that search.</p>
  ${TOOLS(w)}
  ${FOOTER}`;
}
function weekMini(t,w,ab){
  const g = w.games.find(x=>x.away===ab||x.home===ab);
  const out = [["2025", t.rec], ["win total", t.wt], ["rank", t.rank]];
  if (g){
    const home = g.home===ab;
    out.push([home?"vs":"at", home?g.away:g.home]);
    if (g.awayScore!=null){
      const mine = home?g.homeScore:g.awayScore, theirs = home?g.awayScore:g.homeScore;
      const res = mine>theirs?"W":mine<theirs?"L":"T";
      out.push(["result", res+" "+mine+"-"+theirs, res==="W"?"win":res==="L"?"loss":""]);
    } else out.push(["kickoff", g.time.replace(" ET","")]);
  }
  return out;
}

/* ============================ ranks ============================ */
const BASE = (()=>{
  const rankBy = (arr, key, desc) => {
    const s = [...arr].sort((a,b)=> desc ? b[key]-a[key] : a[key]-b[key]);
    const m = {}; s.forEach((t,i)=> m[t.ab] = i+1); return m;
  };
  const off = rankBy(TEAMS,"pf",true);      // most points scored in 2025
  const def = rankBy(TEAMS,"pa",false);     // fewest points allowed in 2025
  const srs = rankBy(TEAMS,"srs",true);     // 2025 overall finish
  const m = {}; TEAMS.forEach(t => m[t.ab] = {off:off[t.ab], def:def[t.ab], srs:srs[t.ab]});
  return m;
})();
function defaultGrades(ab){
  const b = BASE[ab], t = T[ab];
  return { overall:{rank:t.rank, prev:b.srs}, offense:{rank:b.off}, defense:{rank:b.def} };
}
const ORD = n => { const s=["th","st","nd","rd"], v=n%100; return n + "<sup>" + (s[(v-20)%10]||s[v]||s[0]) + "</sup>"; };
function deltaChip(g){
  if (!g || g.rank==null || g.prev==null) return '<span class="delta none">0</span>';
  const d = g.prev - g.rank;
  if (d === 0) return '<span class="delta flat">even</span>';
  return '<span class="delta ' + (d>0?"up":"down") + '">' + (d>0?"\u25B2":"\u25BC") + " " + Math.abs(d) + '</span>';
}
function gradeBlock(w, ab, grades){
  const g = grades || defaultGrades(ab);
  const cap = w.type === "outlook"
    ? "Preseason rank, change since 2025 finish"
    : "Rank after " + w.label + ", change from last week";
  const cell = (lab, o) => `<div class="grade"><span class="lab">${lab}</span>
    <span class="val">${o && o.rank!=null ? ORD(o.rank) : "&ndash;"}</span>${deltaChip(o)}</div>`;
  return `<div class="gradecap">${cap}</div><div class="grades">
    ${cell("Overall", g.overall)}${cell("Offense", g.offense)}${cell("Defense", g.defense)}
  </div>`;
}

/* ============================ next up panel ============================ */
function nextPanel(w, ab, note, grades){
  if (!w.next || !w.next.games) return "";
  const g = w.next.games.find(x=>x.away===ab||x.home===ab);
  const head = `<h5>${ICON.next}Next up<span class="wk">${w.next.label||""}</span></h5>`;
  if (!g) return `<div class="panel next">${head}${gradeBlock(w, ab, grades)}<div class="pending">Bye week.</div></div>`;
  const home = g.home===ab, opp = T[home?g.away:g.home];
  return `<div class="panel next">${head}
    ${gradeBlock(w, ab, grades)}
    <div class="nextrow">
      <div class="badge" style="background:${opp.color};color:${txt(opp.color)}">${opp.ab}</div>
      <div><div class="who"><em>${home?"vs":"at"}</em> ${opp.name}</div><div class="whn">${g.day} &middot; ${g.time} &middot; ${g.tv}</div></div>
    </div>
    <div class="nextvenue">${g.venue}</div>
    ${(note&&note.length) ? note.map(n=>`<p>${n}</p>`).join("") : `<div class="pending">No note yet.</div>`}
  </div>`;
}

/* ============================ shared card ============================ */
function teamCard(t, sub, sections, mini, extra){
  const search = esc([t.name,t.ab,t.div,sub,sections.map(s=>s.t+" "+s.items.join(" ")).join(" "), extra||""].join(" "));
  return `<article class="card" id="${slug(t.name)}-${ACTIVE}" style="--tc:${t.color}" data-conf="${t.conf}" data-search="${search}">
    <div class="card-top">
      <div class="row">
        <div class="badge" style="color:${txt(t.color)}">${t.ab}</div>
        <div><h4>${t.name}</h4><div class="sub">${sub}</div></div>
      </div>
      <div class="mini">${mini.map(m=>`<span class="pill ${m[2]||""}"><b>${m[1]}</b>${m[0]}</span>`).join("")}</div>
    </div>
    <div class="panels">${sections.map(s=>`
      <div class="panel ${s.tone==="up"?"up":s.tone==="down"?"down":""}">
        <h5>${ICON[s.tone==="up"?"up":s.tone==="down"?"down":"n"]}${s.t}</h5>
        ${s.items.length ? `<ul>${li(s.items)}</ul>` : `<div class="pending">Nothing loaded for this section yet.</div>`}
      </div>`).join("")}${extra||""}</div>
